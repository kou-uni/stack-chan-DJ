<div id="s">connecting…</div>
<script>
// ── スタックチャンが聴いた音が、この画面を動かす ──────────────
// ★流れているのは、**この子を動かしている本物のソース**（2026-09-12 本人の要望）。
//   飾りの 0/1 ではなく、いま実機で走っているコードが光る。
const CODE = ["from __future__ import annotations", "import colorsys", "import json", "import math", "import time", "class LedState:", "\"segments\", \"show\")", "SERIES = {", "SWEEP_BEATS = 0.96", "pattern=\"strobe\", cycle_beats=8):", "self.count = count", "self.target = target", "self.pattern = pattern", "self.bpm = 0.0", "self.enabled = False", "self.manual = False", "self.base_pattern = pattern", "self.hold_until = 0.0", "self.swoon = False", "self.flash_white = False", "self.groove = 1.0", "self.talk: str | None = None", "self.now = time.time", "if bpm and bpm > 0:", "self.bpm = bpm", "if last_beat_age_ms is not None:", "def _phase(self):", "bpm = self.bpm", "if bpm <= 0 and self.manual:", "bpm = self.free_bpm", "if bpm <= 0:", "return 0, 0.0", "period = 60.0 / bpm", "elapsed = time.time() - self.beat0", "n = int(elapsed // period)", "@staticmethod", "def _hsv(h, s=1.0, v=1.0):", "i = int(h * 6) % 6", "f = h * 6 - int(h * 6)", "def _drop_flash(self):", "t = self.now()", "step = beat / 4", "i = int(t / step)", "ph = (t % step) / step", "return [[v, v, v]] * self.count", "def colors(self):", "c = self.TALK_COLOR.get(self.talk)", "if c is not None:", "k = self.max_brightness * f", "return self._drop_flash()", "n, ph = self._phase()", "if self.swoon:", "t = time.time() * 0.9", "return self._show(n, ph, k)", "out = [[0, 0, 0]] * self.count", "out = []", "for i in range(self.count):", "return out", "self_pat = self.pattern", "if self_pat == \"strobe\":", "f = max(0.0, 1.0 - ph / 0.25)", "elif self_pat == \"chase\":", "d = (i - head) % self.count", "elif self_pat == \"rainbow\":", "spin = (n + ph) * 0.12", "else:  # split", "for i in range(self.count)", "def _mul(self, c, f):", "int(max(0, min(255, c[1] * f))),", "int(max(0, min(255, c[2] * f)))]", "def _tone(self, n: int):", "def _pick(self, n: int) -> str:", "m = len(self.SHOW_MIX)", "q = m - 1", "slot = n // self.SHOW_BEATS", "full, rem = divmod(slot, q)", "+ rem * (rem + 1) // 2)", "return self.SHOW_MIX[moved % m]", "span = self.count - 1", "mid = span / 2.0", "white = (255, 255, 255)", "u = max(0.0, min(1.0, u))", "if direction == \"ltr\":", "heads = [u * (self.count + 6) - 3]", "elif direction == \"rtl\":", "for head in heads:", "d = abs(i - head)", "if d >= 3.5:", "continue", "f = (1.0 - d / 3.5) ** 1.8 * k", "c = white if d < 1.2 else cold", "for j in range(3):", "def _show(self, n, ph, k):", "pat = self.pattern", "if pat == \"show\":", "pat = self._pick(n)", "if pat == \"laser\":", "t = (n + ph) * speed", "for head in (a, b):", "if d >= 2.4:", "f = (1.0 - d / 2.4) ** 2 * k", "c = white if d < 0.9 else cold", "out[i][j] = out[i][j] + c[j] * f", "if ph < 0.06:", "if pat == \"sweep\":", "if pat == \"build\":", "if u >= self.BUILD_HOLD:", "return [[0, 0, 0]] * self.count", "f = (blink ** 3) * k", "if pat == \"segments\":", "nb = self.SEG_BLOCKS", "size = self.count / nb", "sub = int(ph * 2)", "key = n * 5 + sub * 11", "for b in range(nb):", "fade = 1.0 - (ph * 2 % 1.0) * 0.22", "v = self._mul(c, fade * k)", "for i in range(lo, hi):", "out[i] = list(v)", "if pat == \"sparks\":", "seed = (n * 7 + sub * 13)", "fade = 1.0 - (ph * 4 % 1.0) * 0.7", "out[i] = self._mul(c, fade * k)", "sub_ph = (ph * 4) % 1.0", "if sub == 3 and (n % 2 == 1):", "HOLD_S = 20.0", "now: float | None = None) -> None:", "self.pattern = name", "self.manual = True", "if self.beat0 <= 0:", "self.beat0 = now", "self.pattern = self.base_pattern", "return self.pattern", "def frame(self) -> str:", "return json.dumps({", "\"source\": \"ddj-flx2\",", "\"kind\": \"continuous\",", "\"ts\": int(time.time() * 1000),", "\"colors\": colors,", "import random"];

const cv = document.getElementById('c'), g = cv.getContext('2d', {alpha:false});
const tag = document.getElementById('s');
let S = {bpm:0, n:0, series:'blue', dancing:false, drop:false,
         talk:null, mode:'off', jog:0, jogw:0};
let lastN = -1, pulse = 0, flash = 0;

// ── 色。★ビビッドに。くすませない ─────────────────────
const SERIES = {
  blue: {h:196, h2:272, core:'#dffbff'},
  red:  {h:352, h2: 28, core:'#fff0e6'},
};
const TALK = {listening:{h:150, h2:196, core:'#e6fff0'},
              speaking:{h:212, h2:286, core:'#e9f3ff'}};
function pal(){ return (S.talk && TALK[S.talk]) || SERIES[S.series] || SERIES.blue; }

// ── 降ってくるコード ───────────────────────────────
let LH = 0, ROWS = 0, FS = 0;
// ★3面ディスプレイ。**中央は正面、左右は奥へ向いている。**
//   字を傾けるだけでは遠近にならない（2026-09-13 失敗）。
//   **裏で正面から描いて、台形に縮めて貼る。** 遠い端ほど背が低くなる
// ★消失点＝見ている人の目の高さ。**下げるほど床が低く、壁が高く見える**
const HORIZON = 0.72;
// ★左右のウォールは**客席側へ回り込む**（凹）。中央がいちばん奥。
//   中央を一番手前にすると「せり出た」形になって嘘になる（2026-09-13 本人の指摘）
const CENTER_K = 0.60;         // 中央（最奥）の見かけの高さ
// ★背面ウォールが主役。**袖は短い返し**（実際の会場もそう。2026-09-13）。
//   袖を広く取ると、正面がせり立って見える
const PANELS = [
  // near = 画面の外側（手前）。far = 中央寄り（奥）
  {x0: 0.000, w: 0.170, side: 'left',  farScale: CENTER_K, dim: 0.62},
  {x0: 0.175, w: 0.650, side: null,    farScale: CENTER_K, dim: 1.00},
  {x0: 0.830, w: 0.170, side: 'right', farScale: CENTER_K, dim: 0.62},
];
let panels = [];
// ★夜空。屋外の会場にする（2026-09-13 本人の案）。
//   星は**一度だけ**決める。毎フレーム作り直すと、ちらついて安っぽい
let stars = [];
function makeStars(){
  let seed = 20260913;
  const rnd = () => (seed = (seed*1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  stars = Array.from({length: 260}, () => {
    const r = rnd();
    return {x: rnd(), y: rnd(), m: 0.25 + r*r*0.75, tw: rnd()*6.28};
  });
}

function layout(){
  const dpr = Math.min(devicePixelRatio||1, 2);
  cv.width = innerWidth*dpr; cv.height = innerHeight*dpr;
  g.setTransform(dpr,0,0,dpr,0,0);
  FS = Math.max(10, Math.min(17, innerWidth/110));
  LH = FS*1.22;
  ROWS = Math.ceil(innerHeight/LH)+3;
  panels = PANELS.map(pn => {
    const pw = innerWidth*pn.w;
    // ★裏キャンバスは「実寸のパネル」。奥のパネルは実際にはもっと横に長い
    const bw = pn.far ? pw/pn.farScale : pw;
    const n = Math.max(3, Math.floor(bw/(FS*6.4)));
    const cw = bw/n;
    const off = document.createElement('canvas');
    off.width = Math.ceil(bw); off.height = Math.ceil(innerHeight);
    return {...pn, px: innerWidth*pn.x0, pw, bw, off, octx: off.getContext('2d'),
      cols: Array.from({length:n}, (_,i)=>({
        x: i*cw,
        off: Math.random()*ROWS,
        spd: 0.30 + Math.random()*0.55,
        hue: Math.random(),
        rows: Array.from({length:ROWS+3},
                         ()=>CODE[(Math.random()*CODE.length)|0]),
      }))};
  });
}
addEventListener('resize', layout); layout(); makeStars();

// ── スポットライト ───────────────────────────────
// ★ライトは**会場のトラスに吊られている。** 光源が宙に浮いていると嘘に見える
//   （2026-09-12 本人の指摘）。灯体を描いて、その**レンズから**光を出す。
//   Alan Walker のライブのように、拍で ぱぱぱっ と点く。
// ★実際のクラブ規模だと、1本のトラスにムービングヘッドは**4〜8台**。
//   9台は多すぎた（2026-09-12 本人の指摘）。6台にして、**左右対称に振る**
//   —— 実際の照明も対で組む。バラバラに振ると素人の仕込みに見える
const N_LIGHTS = 3;   // ★小さな会場。**2〜3台で十分**（本人の指示）
const BEAMS = Array.from({length:N_LIGHTS}, (_,i)=>{
  const pair = i < N_LIGHTS/2 ? i : (N_LIGHTS-1-i);   // 対になる相手と同じ癖
  return {
    base: (pair/(N_LIGHTS/2))*Math.PI*0.7,
    sw:   0.85 + pair*0.28,
    hue:  pair/(N_LIGHTS/2),
    cx:   0.22 + (i/(N_LIGHTS-1))*0.56,   // 中央寄りに3台
    mirror: i === 1 ? 0 : (i === 0 ? -1 : 1),   // 中央は正面、両脇が対称
    on:   0,
    phase: pair % 2,
    // ★実際のムービングヘッドは**ゆらゆらしない。**
    //   キューの位置へ素早く動いて、次のキューまで止まっている。
    //   光の「ぱぱぱ」はシャッターで、灯体は静止したまま（2026-09-12 本人の問い）
    ang: 0, tgt: 0, vel: 0,
    hueDeg: 0,        // 点灯のたびに決める。**点いている間は変えない**
  };
});

// 照明の「キュー」。★実際の仕込みも、こういう型を組んで切り替える
// ★DJイベントの照明は速くて大振り。**小さく揺らさない**
const LOOKS = [
  (b,i,n)=> b.mirror * 1.15,                       // ハの字に大きく開く
  (b,i,n)=> -b.mirror * 1.15,                      // 内側で深くクロス
  (b,i,n)=> 0,                                     // 全部まっすぐ下（止める）
  (b,i,n)=> (i/(n-1) - 0.5) * 2.4,                 // 扇（ファン）
  (b,i,n)=> -(i/(n-1) - 0.5) * 2.4,                // 逆ファン
  (b,i,n)=> (i % 2 ? 1 : -1) * 1.0,                // 一つ置きに交互
  (b,i,n)=> b.mirror * 1.45,                       // 目一杯外へ
  (b,i,n)=> -0.55 + i*0.55,                        // 階段状にずらす
  // ★演者を狙う。**実際のライブは、まず演者を照らす。**
  //   実機は画面の中央下に立っている。そこへ全部を向ける（2026-09-13）
  (b,i,n)=> Math.atan2(0.5 - b.cx, 0.62) * 1.35,
  (b,i,n)=> Math.atan2(0.5 - b.cx, 0.62) * 1.35,   // 出やすくするため2つ入れる
];
let look = 0, lookAt = -1;

function newLook(n){
  // ★毎回ばらばらに動かさない。**型ごと切り替える**
  if (n === lookAt) return;
  lookAt = n;
  let k = look;
  while (k === look) k = (Math.random()*LOOKS.length)|0;
  look = k;
  BEAMS.forEach((b,i)=> b.tgt = LOOKS[look](b, i, BEAMS.length));
}
newLook(0);
let bar = 0;

// ★縮尺を決める。**画面の横幅を会場9mとみなす**（2026-09-12 本人の指摘）。
//   30cm角のトラスが画面幅の0.7%しかなく、針金のように細かった
const VENUE_W = 9.0;                     // 画面の横幅が何メートルか
function M(){ return innerWidth / VENUE_W; }          // 1メートルの画素数
// ★トラスは**壁より手前**にある。壁と同じ縮尺で描くと小さすぎて浮く。
//   手前のものは枠からはみ出すのが自然（2026-09-13 本人の指摘）
const TRUSS_NEAR = 1.7;                               // 壁に対する手前ぶんの倍率
function trussY(){ return Math.max(30, innerHeight*0.055); }
function trussH(){ return M() * 0.30 * TRUSS_NEAR; }  // 箱トラス 30cm角
function braceP(){ return M() * 0.55 * TRUSS_NEAR; }
function rigLen(){ return M() * 0.55 * TRUSS_NEAR; }  // ムービングヘッド 約55cm
// ★レンズ（光が出る口）の位置。**描く側と光る側で必ず同じ値を使う**
//   ばらばらに計算していたので、光が出る場所がずれていた（2026-09-12）
const BASE_Y = 0.42, BASE_H = 0.36, YOKE_H = 0.28, HEAD_H = 0.40;
function pivotY(){                     // ヨークの支点（ここを中心にヘッドが回る）
  return trussY() + trussH()*BASE_Y + rigLen()*(BASE_H + YOKE_H);
}
// ★レンズは**回った先**にある。ヘッドが向きを変えれば、光の出口も動く
//   （2026-09-13：横に潰して固定していたので、最初の姿勢のまま止まって見えた）
function lensPos(cx, ang){
  const r = rigLen()*HEAD_H;
  return {x: cx + Math.sin(ang)*r, y: pivotY() + Math.cos(ang)*r};
}
function lensY(){ return pivotY() + rigLen()*HEAD_H; }   // 真下を向いたとき

function stepHeads(dt){
  // ★実際の灯体は、キューへ素早く動いて**止まる。** 少し行き過ぎて戻る（慣性）
  for (const b of BEAMS){
    // ★実際のムービングヘッドは速い。**0.2秒で振り切って止まる**
    //   （2026-09-12 本人の指摘：ゆるゆる揺れていた）
    const k = 190.0, damp = 26.0;
    b.vel += (b.tgt - b.ang) * k * dt;
    b.vel -= b.vel * damp * dt;
    b.ang += b.vel * dt;
  }
}

function trussRun(x0, y0, x1, y1, s, a){
  // ★トラスは1本の関数で描く。**横も縦も同じ素材・同じ粒度・同じ太さ。**
  //   別々に描いていたので、柱だけ別物に見えていた（2026-09-13 本人の指摘）
  //   s : 縮尺（1 = 手前の吊りトラスと同じ）／a : 濃さ
  const len = Math.hypot(x1-x0, y1-y0);
  if (len < 1) return;
  const ux = (x1-x0)/len, uy = (y1-y0)/len;     // 進む向き
  const nx = -uy, ny = ux;                      // 法線（弦材のずれ）
  const h = M()*0.30*s;                         // 箱トラス 30cm角
  const pipe = Math.max(1.2, M()*0.05*s);       // パイプ径 5cm
  const bp = M()*0.55*s;                        // 筋交いの間隔 55cm

  // ★中は塗らない。**箱トラスは骨組み。隙間から背景が透ける**
  //   （2026-09-13 本人の指摘：塗り潰していたので板になっていた）
  //   奥に見えるものが、ほんのり暗くなるだけ
  g.fillStyle = 'rgba(2,3,6,'+(0.16*a)+')';
  g.beginPath();
  g.moveTo(x0+nx*h/2, y0+ny*h/2); g.lineTo(x1+nx*h/2, y1+ny*h/2);
  g.lineTo(x1-nx*h/2, y1-ny*h/2); g.lineTo(x0-nx*h/2, y0-ny*h/2);
  g.closePath(); g.fill();

  // ② 筋交い（ジグザグ＋垂直材）。**これは実体なので不透明**
  g.strokeStyle = 'rgba(30,36,46,'+(0.92*a)+')';
  g.lineWidth = pipe*0.62;
  g.lineCap = 'round';
  g.beginPath();
  for (let d = 0; d < len; d += bp){
    const p0 = Math.min(d, len), p1 = Math.min(d+bp*0.5, len), p2 = Math.min(d+bp, len);
    const P = (q, side) => [x0+ux*q + nx*h/2*side, y0+uy*q + ny*h/2*side];
    let [ax,ay] = P(p0,-1), [bx,by] = P(p1, 1), [cx2,cy2] = P(p2,-1);
    g.moveTo(ax,ay); g.lineTo(bx,by); g.lineTo(cx2,cy2);
    const [vx,vy] = P(p1,-1);
    g.moveTo(bx,by); g.lineTo(vx,vy);
  }
  g.stroke();
  // ★丸パイプなので、片側に細い照りが出る
  g.strokeStyle = 'rgba(130,148,180,'+(0.30*a)+')';
  g.lineWidth = pipe*0.20;
  g.stroke();

  // ③ 弦材（丸いパイプ）。**片側だけ明るい**
  for (const side of [-1, 1]){
    const cx0 = x0 + nx*h/2*side, cy0 = y0 + ny*h/2*side;
    const cx1 = x1 + nx*h/2*side, cy1 = y1 + ny*h/2*side;
    const gr = g.createLinearGradient(cx0 - nx*pipe/2, cy0 - ny*pipe/2,
                                      cx0 + nx*pipe/2, cy0 + ny*pipe/2);
    gr.addColorStop(0,    'rgba(158,174,204,'+(0.85*a)+')');
    gr.addColorStop(0.32, 'rgba(52,62,80,'+(0.97*a)+')');
    gr.addColorStop(1,    'rgba(3,4,8,'+(0.99*a)+')');
    g.strokeStyle = gr;
    g.lineWidth = pipe;
    g.beginPath(); g.moveTo(cx0,cy0); g.lineTo(cx1,cy1); g.stroke();
  }
  g.lineCap = 'butt';
}

function trussCorner(x, y, s, a){
  // ★角には継ぎ手が入る。**トラス同士は交差せず、ブロックで繋がる**
  const h = M()*0.30*s;
  g.fillStyle = 'rgba(16,20,27,'+(0.95*a)+')';
  rrect(x - h*0.58, y - h*0.58, h*1.16, h*1.16, h*0.14); g.fill();
  g.fillStyle = 'rgba(120,136,166,'+(0.22*a)+')';
  rrect(x - h*0.58, y - h*0.58, h*1.16, h*0.14, h*0.06); g.fill();
}

function drawTruss(a){
  const y = trussY(), OVER = innerWidth*0.06;
  trussRun(-OVER, y, innerWidth+OVER, y, TRUSS_NEAR, a);
}

function beams(t, p, energy, heat){
  const ty = trussY(), L = rigLen();

  // ── 光の筋（加算）。★揺らさない。太さも色も、点いている間は動かさない
  g.globalCompositeOperation = 'lighter';
  for (const b of BEAMS){
    // ★シャッター。**灯体は止まったまま、光だけが刻む。** これが派手さの正体
    b.on = Math.max(0, b.on - 0.055);
    b.pw = 0;
    // ★シャッターで刻む。**灯体は止まったまま、光だけがチカチカする。**
    //   これが DJ の現場の派手さの正体（2026-09-12 本人の指摘）
    const rate = 12 + 10*heat;                  // 1秒あたりの開閉
    const ph16 = (t*rate + b.phase*0.5) % 1;
    const shut = 0.30 + 0.70*Math.pow(1 - ph16, 1.6);
    const power = b.on*b.on * (0.55 + energy) * (0.35 + 0.65*shut);
    b.pw = power;                    // ★反射を描くために残す
    if (power < 0.012) continue;

    // ★上の吊り灯体は手に連動しない。**こすりに反応するのは下の2本だけ**
    //   （2026-09-12 本人の指摘）。上は仕込んだキュー通りに動く
    const a = b.ang;
    const hue = b.hueDeg;                       // ★灯体ごとに固定。churn させない
    const half = M()*0.115;                     // 出口の半径 11.5cm
    const spread = 0.085;                       // 開き角（固定）★太く
    const far = innerHeight*1.5;

    const LP = lensPos(innerWidth*b.cx, a);
    g.save();
    g.translate(LP.x, LP.y);
    g.rotate(a);

    // ★光学に合わせる（2026-09-12 本人の指摘）
    //   ・**逆二乗則**：円錐が広がるので、断面あたりの強さは距離の二乗で落ちる
    //   ・**見えているのは空気中の散乱光**。だから縁が無い。幅の違う層を重ねて溶かす
    //   ・**中心は白飛びする**（彩度が落ちる）。外側ほど色が乗る
    //   ・遠いほど広がって薄い → 層ごとに減衰の効き方を変える
    // ★ヘイズが濃い。**光は太い塊になる**（参考画像）。細い筋ではない
    for (const [wm, am, sat, lig] of [[6.0, 0.016, 60, 40],
                                      [4.0, 0.028, 72, 46],
                                      [2.6, 0.048, 84, 54],
                                      [1.6, 0.080, 88, 64],
                                      [0.9, 0.130, 70, 80],
                                      [0.35,0.210, 30, 95]]){
      const gg = g.createLinearGradient(0, 0, 0, far);
      // ★逆二乗を階段で近似する。d0 は「光源からこの距離で半分」の目安
      for (const s of [0, 0.06, 0.14, 0.26, 0.45, 0.70, 1.0]){
        const d = 1 + s*7.0;                       // 距離（出口を1とする）
        gg.addColorStop(s, 'hsla('+hue+','+sat+'%,'+lig+'%,'
                      + (am*power/(d*d)) + ')');
      }
      g.fillStyle = gg;
      g.beginPath();
      g.moveTo(-half*wm, 0); g.lineTo(half*wm, 0);
      g.lineTo(far*spread*wm, far); g.lineTo(-far*spread*wm, far);
      g.closePath(); g.fill();
    }

    // レンズ。★明るい点は目でも滲む（ブルーム）。芯は白、外へ色が出る
    for (const [r, a2, s2, l2] of [[5.0, 0.10, 90, 55],
                                   [2.2, 0.35, 70, 78],
                                   [0.9, 0.85, 25, 97]]){
      const gl = g.createRadialGradient(0,0,0, 0,0, half*r);
      gl.addColorStop(0,   'hsla('+hue+','+s2+'%,'+l2+'%,'+(a2*power)+')');
      gl.addColorStop(0.5, 'hsla('+hue+','+(s2+8)+'%,'+(l2-16)+'%,'+(a2*0.28*power)+')');
      gl.addColorStop(1,   'hsla('+hue+',95%,55%,0)');
      g.fillStyle = gl;
      g.beginPath(); g.arc(0,0, half*r, 0, 6.2832); g.fill();
    }
    g.restore();
  }
  g.globalCompositeOperation = 'source-over';

}

function rrect(x, y, w, h, r){
  // 角の丸い箱。★実機に角張ったところは少ない
  const rr = Math.min(r, w/2, h/2);
  g.beginPath();
  g.moveTo(x+rr, y);
  g.arcTo(x+w, y,   x+w, y+h, rr);
  g.arcTo(x+w, y+h, x,   y+h, rr);
  g.arcTo(x,   y+h, x,   y,   rr);
  g.arcTo(x,   y,   x+w, y,   rr);
  g.closePath();
}

function rig(heat){
  // ── 灯体とトラスの実体。★線は引かない。**黒い塊として置く**
  //   ★一番手前。奥から：有機ELパネル → 空気中の光 → トラスと灯体
  const ty = trussY(), L = rigLen();
  const fade = Math.min(1, heat*1.6);
  drawTruss(fade);
  const ink = 'rgba(3,4,7,'+(0.93*fade + 0.06)+')';
  const lit = 'rgba(120,140,175,'+(0.10*fade)+')';   // 上面がわずかに光を拾う

  for (const b of BEAMS){
    const pan = Math.max(-1.4, Math.min(1.4, b.ang));
    const sx = Math.max(0.20, Math.cos(pan));      // パンで細く見える
    g.save();
    g.translate(innerWidth*b.cx, ty);
    g.fillStyle = ink;

    // ★クランプ（トラスを挟む金具）。丸みのある小さな塊
    rrect(-L*0.16, -trussH()*0.62, L*0.32, trussH()*0.95, L*0.06); g.fill();

    // ★ベース（本体）。角の丸い箱。ここにパンのモーターが入っている
    const by = trussH()*BASE_Y;
    rrect(-L*0.38, by, L*0.76, L*BASE_H, L*0.12); g.fill();
    // 上面のわずかな照り返し
    g.fillStyle = lit;
    rrect(-L*0.38, by, L*0.76, L*0.08, L*0.04); g.fill();
    g.fillStyle = ink;

    g.translate(0, by + L*BASE_H);
    g.scale(sx, 1);                                 // ★ここから先がパンで回る

    // ★ヨーク（Uの字の腕）。**曲がった腕**。直線の棒ではない
    g.lineCap = 'round';
    g.strokeStyle = ink;
    g.lineWidth = L*0.14;
    g.beginPath();
    g.moveTo(-L*0.38, -L*0.02);
    g.quadraticCurveTo(-L*0.43, L*0.16, -L*0.34, L*0.28);
    g.moveTo( L*0.38, -L*0.02);
    g.quadraticCurveTo( L*0.43, L*0.16,  L*0.34, L*0.28);
    g.stroke();

    // ★ヘッド（円筒）。前が少しすぼまり、先端は丸いレンズ面
    g.translate(0, L*YOKE_H);
    g.rotate(0.22);                                 // 客席へ向けた固定のチルト
    g.beginPath();
    g.moveTo(-L*0.28, -L*0.06);
    g.quadraticCurveTo(-L*0.30, L*0.20, -L*0.23, L*0.40);
    g.lineTo( L*0.23, L*0.40);
    g.quadraticCurveTo( L*0.30, L*0.20,  L*0.28, -L*0.06);
    g.closePath();
    g.fill();
    // 後ろの丸み（放熱側）
    g.beginPath(); g.ellipse(0, -L*0.06, L*0.28, L*0.12, 0, 0, 6.2832); g.fill();
    // レンズ面（円）
    g.beginPath(); g.ellipse(0, L*0.40, L*0.23, L*0.07, 0, 0, 6.2832); g.fill();
    g.restore();
  }
  // ★ムービングヘッドの間に**ブラインダー**が入る（調査）。横長の箱
  for (const bx of [0.30, 0.50, 0.70]){
    const x = innerWidth*bx, w = L*0.9, h = L*0.30;
    g.fillStyle = 'rgba(4,5,9,'+(0.92*fade+0.06)+')';
    rrect(x - w/2, ty + trussH()*0.42, w, h, L*0.05); g.fill();
    // 4灯のレンズ
    g.fillStyle = 'rgba(20,24,32,'+(0.8*fade)+')';
    for (let i=0; i<4; i++){
      g.beginPath();
      g.ellipse(x - w*0.33 + i*w*0.22, ty + trussH()*0.42 + h*0.5,
                w*0.075, h*0.28, 0, 0, 6.2832);
      g.fill();
    }
  }
  g.lineCap = 'butt';

  // ── ★レンズの発光。**筐体を描いたあとに乗せる。**
  //   先に描いていたので、黒い筐体に塗り潰されて「光源が黒いまま」だった
  g.globalCompositeOperation = 'lighter';
  for (const b of BEAMS){
    const pw = b.pw || 0;
    if (pw < 0.02) continue;
    const LP = lensPos(innerWidth*b.cx, b.ang);
    const cx = LP.x, ly = LP.y, hue = b.hueDeg, half = M()*0.115;
    for (const [r, a2, s2, l2] of [[4.2, 0.10, 90, 55],
                                   [2.0, 0.34, 70, 80],
                                   [0.85,0.90, 20, 98]]){
      const gl = g.createRadialGradient(cx, ly, 0, cx, ly, half*r);
      gl.addColorStop(0,   'hsla('+hue+','+s2+'%,'+l2+'%,'+(a2*pw)+')');
      gl.addColorStop(0.5, 'hsla('+hue+','+(s2+8)+'%,'+(l2-16)+'%,'+(a2*0.28*pw)+')');
      gl.addColorStop(1,   'hsla('+hue+',95%,55%,0)');
      g.fillStyle = gl;
      g.beginPath(); g.arc(cx, ly, half*r, 0, 6.2832); g.fill();
    }
  }
  g.globalCompositeOperation = 'source-over';

  // ── 反射。★光ると、自分の筐体とトラスがその色を拾う
  //   （2026-09-12 本人の指摘：真っ黒のままだった）
  g.globalCompositeOperation = 'lighter';
  for (const b of BEAMS){
    const pw = b.pw || 0;
    if (pw < 0.02) continue;
    const LP2 = lensPos(innerWidth*b.cx, b.ang);
    const hue = b.hueDeg, cx = LP2.x, ly = LP2.y;

    // ① 灯体まわりの散り。**レンズの近くがいちばん明るい**
    const sp = g.createRadialGradient(cx, ly, 0, cx, ly, L*1.1);
    sp.addColorStop(0,   'hsla('+hue+',85%,74%,'+(0.52*pw)+')');
    sp.addColorStop(0.4, 'hsla('+hue+',90%,60%,'+(0.18*pw)+')');
    sp.addColorStop(1,   'hsla('+hue+',90%,50%,0)');
    g.fillStyle = sp;
    g.beginPath(); g.arc(cx, ly, L*1.1, 0, 6.2832); g.fill();

    // ② トラスに当たる。★**手前にあるので強く出る**（2026-09-13 本人の指摘）
    const h = trussH(), pipe = M()*0.05, top = ty - h/2, bot = ty + h/2;
    // ★光が当たったところだけ。そこから**ぼんやり暗くなる**
    const w = L*1.1;
    // ★自分の真上のパイプがいちばん明るい。**帯で一様に光らせない**
    for (const [cy, kk] of [[top, 0.8], [bot, 1.5]]){
      const gr = g.createRadialGradient(cx, cy, 0, cx, cy, w*0.9);
      gr.addColorStop(0,   'hsla('+hue+',80%,84%,'+(0.40*pw*kk)+')');
      gr.addColorStop(0.4, 'hsla('+hue+',88%,66%,'+(0.13*pw*kk)+')');
      gr.addColorStop(1,   'hsla('+hue+',90%,58%,0)');
      g.fillStyle = gr;
      g.fillRect(cx-w, cy-pipe*0.5, w*2, pipe);
    }
  }
  g.globalCompositeOperation = 'source-over';
}

// ★実機は画面の**中央下**に立つ（実物の配置・2026-09-13）。
//   真後ろに置くと隠れるので、**実機の外側**から立ち上げて、実機を挟む
const UPS = [
  {cx: 0.17, hue: 0.00, side: -1},
  {cx: 0.83, hue: 0.55, side:  1},
];

function stageWell(){
  // ★実機は白い。**背後が明るいと顔が沈む。** 中央下だけ暗く落として浮かせる
  const cx = innerWidth*0.5, cy = innerHeight*1.02;
  const r = Math.min(innerWidth*0.42, innerHeight*0.85);
  const gr = g.createRadialGradient(cx, cy, 0, cx, cy, r);
  gr.addColorStop(0,   'rgba(0,0,0,0.86)');
  gr.addColorStop(0.55,'rgba(0,0,0,0.55)');
  gr.addColorStop(1,   'rgba(0,0,0,0)');
  g.fillStyle = gr;
  g.fillRect(0, innerHeight*0.35, innerWidth, innerHeight*0.65);
}

function spill(clip, objX, yTop, yBot, gain){
  // ★物に当たる光。**線ではなく、まだら。**
  //   光は1点から来るので、当たるのは面の一部だけ。そこから四方に落ちる
  g.save();
  clip();
  g.globalCompositeOperation = 'lighter';
  // ★下からの光も物に当たる。上だけ見ていた（2026-09-13 本人の指摘）
  const sources = [
    ...BEAMS.map(b => ({pw: b.pw||0, hue: b.hueDeg,
                        x: lensPos(innerWidth*b.cx, b.ang).x
                           + Math.tan(b.ang)*(innerHeight-lensY())*0.55,
                        up: false})),
    ...UPS.map(u => ({pw: u.pw||0, hue: u.hueDeg, x: u.x||0, up: true})),
  ];
  for (const b of sources){
    const pw = b.pw || 0;
    if (pw < 0.03) continue;
    const hx = b.x;
    const d = Math.abs(hx - objX) / (M()*2.0);
    const k = (gain||1) * pw / (1 + d*d*2.2);       // ★逆二乗で落ちる
    if (k < 0.02) continue;
    // ★上からの光は上寄り、下からの光は下寄りに当たる
    const py = b.up ? yTop + (yBot - yTop)*0.86 : yTop + (yBot - yTop)*0.12;
    const r  = M()*1.5*(0.55 + pw);
    const gp = g.createRadialGradient(hx, py, 0, hx, py, r);
    gp.addColorStop(0,   'hsla('+b.hue+',80%,84%,'+(0.38*k)+')');
    gp.addColorStop(0.35,'hsla('+b.hue+',85%,66%,'+(0.14*k)+')');
    gp.addColorStop(1,   'hsla('+b.hue+',85%,55%,0)');
    g.fillStyle = gp;
    g.fillRect(objX - r*1.6, yTop, r*3.2, yBot - yTop);
  }
  g.globalCompositeOperation = 'source-over';
  g.restore();
}

function litColor(p){
  // ★いま出ている光の平均。床も天井も柱も、この色を拾う
  let hue = 0, w = 0;
  for (const b of BEAMS){ const q = b.pw || 0; hue += b.hueDeg*q; w += q; }
  for (const u of UPS){   const q = u.pw || 0; hue += (u.hueDeg||0)*q; w += q; }
  return {hue: w > 0 ? hue/w : p.h, pow: Math.min(1.4, w)};
}

function wash(p, amt){
  // ★実際のライブは部屋全体が一色に染まる。局所的なビームだけでは足りない
  if (amt < 0.02) return;
  const L = litColor(p);
  g.globalCompositeOperation = 'lighter';
  const gr = g.createRadialGradient(innerWidth*0.5, trussY(), 0,
                                    innerWidth*0.5, trussY(), innerHeight*1.5);
  gr.addColorStop(0,   'hsla('+L.hue+',92%,52%,'+(0.26*amt)+')');
  gr.addColorStop(0.45,'hsla('+L.hue+',95%,42%,'+(0.15*amt)+')');
  gr.addColorStop(1,   'hsla('+L.hue+',95%,34%,'+(0.06*amt)+')');
  g.fillStyle = gr;
  g.fillRect(0, 0, innerWidth, innerHeight);
  g.globalCompositeOperation = 'source-over';
}

function uplights(t, p, amt, jog){
  // ★ステージ前縁に置いた**アップライト**。こすっている間だけ立ち上がる。
  //   上の吊り灯体と同じ質にする（層を重ねて縁を溶かす・逆二乗・揺らさない）
  if (amt < 0.02) return;
  const y = innerHeight*0.965;
  const far = innerHeight*1.5;
  for (const u of UPS){
    const cx = innerWidth*u.cx;
    const a = u.side*0.26 + jog*1.05;
    const pw = amt * (0.35 + 0.65*Math.abs(jog));
    const hue = (p.h + 170 + u.hue*150) % 360;
    const half = M()*0.13;
    u.pw = pw; u.hueDeg = hue; u.x = cx;      // 反射で使う

    g.globalCompositeOperation = 'lighter';
    g.save();
    g.translate(cx, y);
    g.rotate(Math.PI + a);                    // 上へ向ける
    // ★層を重ねて縁を溶かす。逆二乗で落とす
    for (const [wm, am, sat, lig] of [[5.0, 0.014, 60, 42],
                                      [3.2, 0.026, 74, 50],
                                      [2.0, 0.046, 86, 60],
                                      [1.2, 0.080, 84, 72],
                                      [0.6, 0.140, 40, 92]]){
      const gg = g.createLinearGradient(0, 0, 0, far);
      for (const s2 of [0, 0.08, 0.18, 0.34, 0.58, 1.0]){
        const d = 1 + s2*6.0;
        gg.addColorStop(s2, 'hsla('+hue+','+sat+'%,'+lig+'%,'+(am*pw/(d*d))+')');
      }
      g.fillStyle = gg;
      g.beginPath();
      g.moveTo(-half*wm, 0); g.lineTo(half*wm, 0);
      g.lineTo(far*0.075*wm, far); g.lineTo(-far*0.075*wm, far);
      g.closePath(); g.fill();
    }
    g.restore();
    // レンズのブルーム
    for (const [r, a2, s2, l2] of [[4.0, 0.09, 88, 55], [1.8, 0.32, 66, 80],
                                   [0.8, 0.85, 20, 98]]){
      const gl = g.createRadialGradient(cx, y, 0, cx, y, half*r);
      gl.addColorStop(0, 'hsla('+hue+','+s2+'%,'+l2+'%,'+(a2*pw)+')');
      gl.addColorStop(1, 'hsla('+hue+',95%,55%,0)');
      g.fillStyle = gl;
      g.beginPath(); g.arc(cx, y, half*r, 0, 6.2832); g.fill();
    }
    g.globalCompositeOperation = 'source-over';
    // ★灯体の実体（床置きの小さな箱）。光源が宙に浮かない
    g.fillStyle = 'rgba(4,5,9,0.95)';
    rrect(cx - M()*0.16, y, M()*0.32, M()*0.20, M()*0.03); g.fill();
  }
}

function fireBeams(n){
  // ★拍ごとに違う組が点く。**毎回同じだと機械に見える**
  bar = (bar + 1) % 4;
  // ★全部を同時に点けない。**面になった瞬間、光ではなく霧になる**
  newLook(n);                                       // ★毎拍、位置を変える
  const heavy = (n % 4 === 0);                      // 4拍に1回は全灯
  const pl = pal();
  for (const b of BEAMS){
    b.tgt = LOOKS[look](b, BEAMS.indexOf(b), BEAMS.length);
    // ★色は点けるときに決める。**光っている最中に色が回るのは嘘**
    b.hueDeg = (pl.h + b.hue*70 + ((Math.random()*3)|0)*40) % 360;
    if (heavy) { b.on = 1; continue; }
    if (b.phase === bar) b.on = Math.max(b.on, 0.9);
    else if (Math.random() < 0.25) b.on = Math.max(b.on, 0.7);
  }
}

let prev = performance.now(), t = 0, freeBeat = 0, freeN = 0;
// ★動いていないときは静かに、動いた瞬間に爆発する。**差が無いと見せ場が無い**
//   （2026-09-12 本人の指摘）。急に切り替えず、少しだけ滑らせる
let heat = 0;
// ── スクラッチの気持ち（2026-09-12 本人の問い）──────────────
// **こすっている間は「溜め」。曲を手で掴んで止めている。客の視線が手元に集まる。**
// **離した瞬間が「放つ」。** ゆらゆらさせるだけでは、この緊張と解放が出ない。
//   溜め  → 光を数本に絞り、手の向きへ一斉に向ける。コードは止まる。暗く沈む
//   解放  → 全灯・白フラッシュ・コードが走り出す
let hold = 0, prevHand = 0, release = 0;
function draw(now){
  const dt = Math.min(0.05, (now-prev)/1000); prev = now; t += dt;
  if (S.n !== lastN){ lastN = S.n; pulse = 1; fireBeams(S.n); }
  if (S.drop) flash = 1;
  // ★レコードを触っている＝演者が動かしている。**それも「動いている」**
  //   （2026-09-12：静止中はライトを消しているので、こすっても見えなかった）
  // ★この演出は**演奏中だけ**（2026-09-12 本人の指示）。
  //   静かなときにこすっても、ライトは出さない
  //   ★拍ではなくモードで見る。こすると音楽が止まって拍が消えるため
  const playing = S.mode === 'dj' || S.dancing || !!S.talk;
  const hand = playing ? (S.jogw || 0) : 0;
  // ★離した瞬間を捕まえる。**放つのは、掴んでいた手が開いたとき**
  if (prevHand > 0.5 && hand <= 0.15 && hold > 0.25){ release = 1; flash = 1; fireBeams(0); }
  prevHand = hand;
  // ★こすりは速い。**溜めずに、その場で反応する**（2026-09-12 本人の指摘）
  hold += ((hand > 0.15 ? 1 : 0) - hold) * dt * (hand > 0.15 ? 30.0 : 7.0);
  release = Math.max(0, release - dt*1.6);
  const live = playing || hand > 0.15;
  // ★立ち上がりは速く、落ちるのはゆっくり。**盛り上がりは急に、余韻は残す**
  heat += ((live ? 1 : 0) - heat) * dt * (live ? 6.5 : 0.9);
  heat = Math.max(heat, hand*0.85);      // ★手の分は即座に効かせる

  // 音が来ていないときの自走。**静かなときは叩かない**
  if ((!S.bpm || S.bpm < 1) && heat > 0.25){
    freeBeat += dt;
    if (freeBeat >= 0.5){ freeBeat -= 0.5; pulse = 1; fireBeams(++freeN); }
  }
  pulse = Math.max(0, pulse - dt*3.4);
  flash = Math.max(0, flash - dt*2.0);

  const p = pal();
  // ★静かなとき 0.10 前後、盛り上がると 1.6 くらいまで振れる
  const energy = 0.10 + heat*0.75 + pulse*0.70*heat + flash*0.6;

  // 背景。★静かなときは色を回さない。回ると落ち着かない
  g.fillStyle = 'hsl('+((p.h + t*26*heat) % 360)+','
              + (40 + 45*heat)+'%,'+(0.6 + energy*1.6)+'%)';
  g.fillRect(0,0,innerWidth,innerHeight);
  // ★静かなときはライトを出さない。**コードがゆっくり流れているだけでちょうどいい**
  //   （2026-09-12 本人の指摘）。動き出したら吊り込まれる
  stepHeads(dt);

  const hy = innerHeight*HORIZON;

  // ── 夜空。★**いちばん奥なので最初に描く。**
  //   後から描いていたので、壁の上を塗り潰して一直線に切っていた（2026-09-13）
  //   空は画面いっぱいに広がり、その手前に壁が立つ
  {
    const skyH = innerHeight;                 // ★画面いっぱい。壁が手前で隠す
    // 地平近くはうっすら明るい（街明かり）。**真っ黒な空は嘘**
    const sg = g.createLinearGradient(0, 0, 0, skyH);
    sg.addColorStop(0,   'rgb(2,3,8)');
    sg.addColorStop(0.7, 'rgb(5,7,16)');
    sg.addColorStop(1,   'rgb(10,13,26)');
    g.fillStyle = sg;
    g.fillRect(0, 0, innerWidth, skyH);

    // 星。★下ほど少なく見える（空気が厚い）
    for (const st of stars){
      const y = st.y * (hy*0.95);   // 星は地平より上だけ
      const depth = 0.35 + 0.65*(1 - st.y);
      const tw = 0.75 + 0.25*Math.sin(t*1.6 + st.tw);
      const a = st.m * depth * tw * (1 - Math.min(0.75, heat*0.75));  // 照明が強いと星は負ける
      if (a < 0.02) continue;
      g.fillStyle = 'rgba(214,226,255,'+a+')';
      const r = Math.max(0.6, st.m*1.7);
      g.fillRect(st.x*innerWidth, y, r, r);
    }

  }

  // ── ② 会場の奥：3面のディスプレイ。**裏で正面から描いて、台形に貼る**
  const TAIL = 26 + 14*heat;
  const flow = (0.22 + heat*2.4 + energy*6.0) * (1 - hold*0.45) + release*14.0;

  for (const pn of panels){
    const o = pn.octx;
    o.setTransform(1,0,0,1,0,0);
    o.globalCompositeOperation = 'source-over';
    o.fillStyle = 'hsla('+p.h+',60%,'+(1.5 + 3.5*heat)+'%,1)';
    o.fillRect(0, 0, pn.bw, innerHeight);
    o.textBaseline = 'top';
    o.font = '600 '+FS+'px ui-monospace,SFMono-Regular,Menlo,monospace';
    o.globalCompositeOperation = 'lighter';
    for (const c of pn.cols){
      c.off += dt * c.spd * flow;
      if (c.off > ROWS) c.off -= ROWS;
      for (let r=0; r<ROWS; r++){
        const d = (c.off - r + ROWS) % ROWS;
        if (d > TAIL) continue;
        const txt = c.rows[r];
        if (!txt) continue;
        const hue = (p.h + c.hue*(30+140*heat) + (p.h2-p.h)*(d/TAIL) + t*(2+56*heat)) % 360;
        const a = Math.max(0, 1 - d/TAIL) * (0.045 + 1.05*heat + energy*0.45)
                * (1 - hold*0.25) * (1 + release*0.9);
        if (d < 0.9){
          o.shadowColor = 'hsl('+hue+',100%,72%)';
          o.shadowBlur = 0 + 30*heat + 34*energy;
          o.fillStyle = heat > 0.35 ? p.core
                      : 'hsla('+hue+',45%,'+(26 + 56*heat)+'%,0.42)';
        } else {
          o.shadowColor = 'hsl('+hue+',100%,62%)';
          o.shadowBlur = 0 + 14*heat + 20*energy;
          o.fillStyle = 'hsla('+hue+','+(45 + 55*heat)+'%,'
                      + (15 + 55*heat + 16*(1-d/TAIL))+'%,'+a+')';
        }
        o.fillText(txt, c.x, r*LH);
        if (Math.random() < 0.0004 + 0.006*heat + pulse*0.06*heat){
          c.rows[r] = CODE[(Math.random()*CODE.length)|0];
        }
      }
    }
    o.shadowBlur = 0;

    // ★LEDウォールは**500×500mm のキャビネットの集合**（レンタルの業界標準）。
    //   継ぎ目のグリッドが薄く見えるのが本物。一枚板だと嘘になる（2026-09-13 調査）
    o.globalCompositeOperation = 'source-over';
    const cab = M()*0.5;                       // キャビネット 500mm
    o.strokeStyle = 'rgba(0,0,0,0.55)';
    o.lineWidth = Math.max(1, M()*0.012);      // 継ぎ目 約12mm
    o.beginPath();
    for (let x=cab; x<pn.bw; x+=cab){ o.moveTo(x, 0); o.lineTo(x, innerHeight); }
    for (let y=cab; y<innerHeight; y+=cab){ o.moveTo(0, y); o.lineTo(pn.bw, y); }
    o.stroke();
    // ★キャビネットごとの輝度差。実物は必ず少しばらつく
    o.globalCompositeOperation = 'lighter';
    const nx = Math.ceil(pn.bw/cab), ny = Math.ceil(innerHeight/cab);
    for (let iy=0; iy<ny; iy++){
      for (let ix=0; ix<nx; ix++){
        const v = ((ix*7 + iy*13) % 11) / 11;   // 決め打ちの散らばり（毎フレーム変えない）
        if (v > 0.72){
          o.fillStyle = 'hsla('+p.h+',60%,60%,'+(0.010 + 0.016*heat)+')';
          o.fillRect(ix*cab, iy*cab, cab, cab);
        }
      }
    }
    o.globalCompositeOperation = 'source-over';

    // ★**射影変換**で貼る。等間隔に切って高さだけ縮めるのはアフィンで、遠近ではない
    //   （2026-09-13：垂れ幕に見えていた原因）。
    //   奥へ行くほど**横方向も詰まる**。それが遠近のいちばん強い手がかり。
    //
    //     高さの倍率  s(u) = k / (k + u(1-k))
    //     元画像の位置 su   = k·u / (1 - u(1-k))     （k = 奥端の倍率）
    const k = pn.farScale;
    if (!pn.side){
      // ★中央は正面かつ**最奥**。一様に縮める（傾いていないので歪まない）
      const dh = innerHeight * k, dy = hy - hy * k;
      g.globalAlpha = pn.dim;
      g.drawImage(pn.off, 0, 0, pn.bw, innerHeight, pn.px, dy, pn.pw, dh);
      g.globalAlpha = 1;
    } else {
      // ★左右は**外側が手前**。u=0 が外（手前・高さ1）、u=1 が中央寄り（奥・高さk）
      const N = 96;
      const su = (a)=> k*a / (1 - a*(1-k));
      const mirror = pn.side === 'left';   // 左は画面の左端が手前
      for (let i=0; i<N; i++){
        const u0 = i/N, u1 = (i+1)/N;
        // ★u0=0（画面の端＝手前）で 1、u0=1（中央寄り＝奥）で k。
        //   前は 1/k になっていて、**奥へ行くほど広がっていた**（2026-09-13）
        const s0 = k / (k + u0*(1-k));
        const t0 = su(u0), t1 = su(u1);
        const sx = (mirror ? t0 : 1-t1) * pn.bw;
        const sw = Math.max(1, (t1-t0) * pn.bw);
        const dx = pn.px + (mirror ? u0 : (1-u1)) * pn.pw;
        const dw = pn.pw/N + 1;
        const dh = innerHeight * s0;
        const dy = hy - hy * s0;
        g.globalAlpha = pn.dim * (1 - 0.34*u0);      // 奥ほど暗い
        g.drawImage(pn.off, sx, 0, sw, innerHeight, dx, dy, dw, dh);
      }
      g.globalAlpha = 1;
    }
  }

  // ── 継ぎ目の柱。★**吊りトラスと同じ素材・同じ粒度**（本人の指摘）。
  //   奥にあるので縮尺は壁に合わせる
  const kc = CENTER_K, ch = innerHeight*kc, cy = hy - hy*kc;
  {
    for (const x0 of [0.172, 0.828]){
      const x = innerWidth*x0;
      const hh = M()*0.30*kc*0.85;
      trussRun(x, cy + hh*0.6, x, cy + ch, kc*0.85, 0.85);   // 角の分だけ下から
      // ★光だまり。線ではなく、当たった高さから四方へ落ちる
      spill(() => { g.beginPath();
                    g.rect(x - M()*0.16*kc, cy, M()*0.32*kc, ch); },
            x, cy, cy + ch, 1.25);
    }
  }

  // ── ★ウォールの上端にも横トラス。**枠として一周させる**（本人の指摘）
  {
    const hh = M()*0.30*kc*0.85;
    trussRun(innerWidth*0.172 + hh*0.6, cy,
             innerWidth*0.828 - hh*0.6, cy, kc*0.85, 0.85);
    trussCorner(innerWidth*0.172, cy, kc*0.85, 0.85);
    trussCorner(innerWidth*0.828, cy, kc*0.85, 0.85);
  }

  // ── 床。★奥行きの手がかりで**いちばん強いのは床の収束線**（2026-09-13）。
  //   これが無いと、パネルが宙に浮いて部屋に見えない
  {
    const kc = CENTER_K;
    const backY = hy + (innerHeight - hy) * kc;    // 奥の壁の足元
    g.fillStyle = 'rgba(3,4,8,0.97)';
    g.beginPath();
    g.moveTo(0, innerHeight);
    g.lineTo(innerWidth, innerHeight);
    g.lineTo(innerWidth*0.825, backY);
    g.lineTo(innerWidth*0.175, backY);
    g.closePath(); g.fill();

    // ★床の目地。**手前ほど間隔が広い**。これが遠近を確定させる
    g.strokeStyle = 'hsla('+p.h+',60%,60%,'+(0.06 + 0.14*heat)+')';
    g.lineWidth = Math.max(1, M()*0.008);
    g.beginPath();
    for (let i=1; i<=9; i++){
      const u = i/10;
      const yy = backY + (innerHeight - backY) * (u*u);   // 二乗で手前ほど広く
      const s = (yy - backY) / (innerHeight - backY);
      const xl = innerWidth*0.175 * (1-s) + 0 * s;
      const xr = innerWidth*0.825 * (1-s) + innerWidth * s;
      g.moveTo(xl, yy); g.lineTo(xr, yy);
    }
    // 消失点へ向かう線
    for (const a of [0.10, 0.30, 0.50, 0.70, 0.90]){
      g.moveTo(innerWidth*(0.175 + 0.650*a), backY);
      g.lineTo(innerWidth*a, innerHeight);
    }
    g.stroke();

    // ★床は艶がある。**奥の壁が映り込む。** これが無いと塗り潰した黒に見える
    const cen = panels[1];
    if (cen){
      g.save();
      g.beginPath();
      g.moveTo(0, innerHeight); g.lineTo(innerWidth, innerHeight);
      g.lineTo(innerWidth*0.825, backY); g.lineTo(innerWidth*0.175, backY);
      g.closePath(); g.clip();
      g.globalAlpha = 0.16 + 0.14*heat;
      g.scale(1, -1);                            // 上下を反転して映す
      g.drawImage(cen.off, 0, 0, cen.bw, innerHeight,
                  cen.px, -(backY + innerHeight*kc), cen.pw, innerHeight*kc);
      g.globalAlpha = 1;
      g.restore();
      // 遠いほど映り込みが消える
      const fade = g.createLinearGradient(0, backY, 0, innerHeight);
      fade.addColorStop(0,   'rgba(3,4,8,0.05)');
      fade.addColorStop(0.45,'rgba(3,4,8,0.62)');
      fade.addColorStop(1,   'rgba(3,4,8,0.92)');
      g.fillStyle = fade;
      g.fillRect(0, backY, innerWidth, innerHeight-backY);
    }

    // ★ビームが床に落ちる。**当たったところが光の色になる**
    const L2 = litColor(p);
    g.globalCompositeOperation = 'lighter';
    for (const b of BEAMS){
      const pw2 = b.pw || 0;
      if (pw2 < 0.03) continue;
      const ly2 = lensY();
      const hx = lensPos(innerWidth*b.cx, b.ang).x
               + Math.tan(b.ang) * (innerHeight - ly2) * 0.55;
      const rx = M()*0.55*(1 + 1.6*pw2), ry = rx*0.20;
      const gp = g.createRadialGradient(hx, innerHeight*0.93, 0,
                                        hx, innerHeight*0.93, rx);
      gp.addColorStop(0,   'hsla('+b.hueDeg+',95%,72%,'+(0.32*pw2)+')');
      gp.addColorStop(0.5, 'hsla('+b.hueDeg+',95%,58%,'+(0.10*pw2)+')');
      gp.addColorStop(1,   'hsla('+b.hueDeg+',95%,50%,0)');
      g.fillStyle = gp;
      g.save(); g.translate(hx, innerHeight*0.93); g.scale(1, ry/rx);
      g.beginPath(); g.arc(0, 0, rx, 0, 6.2832); g.fill(); g.restore();
    }
    g.globalCompositeOperation = 'source-over';

    // 壁と床の境目が、いちばん光を拾う
    const gr = g.createLinearGradient(0, backY - M()*0.12, 0, backY + M()*0.10);
    gr.addColorStop(0, 'hsla('+p.h+',80%,62%,0)');
    gr.addColorStop(0.6, 'hsla('+p.h+',80%,68%,'+(0.10 + 0.22*heat)+')');
    gr.addColorStop(1, 'hsla('+p.h+',80%,62%,0)');
    g.fillStyle = gr;
    g.fillRect(innerWidth*0.16, backY - M()*0.12, innerWidth*0.68, M()*0.22);
  }

  // ── ② 空気中の光。パネルの手前を通る
  if (heat > 0.06) beams(t, p, energy, heat);

  // ── ③ 部屋全体が染まる
  wash(p, heat);

  // ── 機材。★手前にあるので、**部屋の色を乗せたあとに描く。**
  //   先に描くと wash で一様に染まって、のっぺりした板になる（2026-09-13）
  {
    const LC2 = litColor(p);
    for (const [cx, dir] of [[0.115, 1], [0.885, -1]]){
      const x = innerWidth*cx, w = M()*0.60, hgt = M()*2.05;
      const yTop = innerHeight*0.99 - hgt;
      const topH = hgt*0.62, subY = yTop + topH, subH = hgt*0.38;
      const sw = w*1.30;

      // ── トップ。**箱なので、面ごとに明るさが違う**
      const face = g.createLinearGradient(x - w/2, 0, x + w/2, 0);
      face.addColorStop(0,    'rgb(9,10,13)');
      face.addColorStop(0.18, 'rgb(26,28,33)');   // 角のハイライト
      face.addColorStop(0.55, 'rgb(14,15,19)');
      face.addColorStop(1,    'rgb(5,6,8)');
      g.fillStyle = face;
      rrect(x - w/2, yTop, w, topH, M()*0.025); g.fill();

      // グリル。★細かいメッシュ。太いスリットだとおもちゃに見える
      g.save();
      rrect(x - w/2 + M()*0.045, yTop + M()*0.05,
            w - M()*0.09, topH - M()*0.10, M()*0.012); g.clip();
      g.fillStyle = 'rgba(0,0,0,0.55)';
      g.fillRect(x - w/2, yTop, w, topH);
      g.fillStyle = 'rgba(70,76,88,0.16)';
      for (let yy = yTop + M()*0.05; yy < yTop + topH; yy += Math.max(2, M()*0.018)){
        g.fillRect(x - w/2, yy, w, Math.max(1, M()*0.008));
      }
      g.restore();

      // ── サブ。**床に置くので、上面が見える**（消失点より下）
      const sface = g.createLinearGradient(x - sw/2, 0, x + sw/2, 0);
      sface.addColorStop(0,    'rgb(7,8,11)');
      sface.addColorStop(0.16, 'rgb(22,24,29)');
      sface.addColorStop(0.6,  'rgb(11,12,16)');
      sface.addColorStop(1,    'rgb(4,5,7)');
      g.fillStyle = sface;
      rrect(x - sw/2, subY, sw, subH, M()*0.025); g.fill();
      // 上面（薄く見える）
      g.fillStyle = 'rgba(40,45,55,0.35)';
      g.beginPath();
      g.moveTo(x - sw/2, subY); g.lineTo(x + sw/2, subY);
      g.lineTo(x + sw/2 - M()*0.05, subY - M()*0.05);
      g.lineTo(x - sw/2 + M()*0.05, subY - M()*0.05);
      g.closePath(); g.fill();
      // ウーファー。**落とし込みなので、縁に影がつく**
      const wr = M()*0.21, wy = subY + subH*0.52;
      const wg = g.createRadialGradient(x, wy - wr*0.25, wr*0.1, x, wy, wr);
      wg.addColorStop(0,   'rgb(24,26,31)');
      wg.addColorStop(0.6, 'rgb(10,11,14)');
      wg.addColorStop(1,   'rgb(2,3,5)');
      g.fillStyle = wg;
      g.beginPath(); g.arc(x, wy, wr, 0, 6.2832); g.fill();
      g.strokeStyle = 'rgba(70,78,92,0.30)';
      g.lineWidth = Math.max(1, M()*0.010);
      g.beginPath(); g.arc(x, wy, wr*0.98, 0, 6.2832); g.stroke();

      // ── ★光は面の一部にしか当たらない。**線で光らせない**
      spill(() => {
        g.beginPath();
        rrect(x - w/2, yTop, w, topH, M()*0.025);
        rrect(x - sw/2, subY, sw, subH, M()*0.025);
      }, x, yTop, yTop + hgt, 1.0);
    }
  }

  // ── 下からの光。★機材より**手前**（ステージ前縁に置く）
  uplights(t, p, playing ? hold : 0, S.jog || 0);

  // ── ④ 実機の居場所を暗く残す（白い顔を沈ませない）
  stageWell();

  // ── トラスの吊り。★空に浮かない
  {
    // 吊り。★トラスは空に浮かない。ワイヤーで上から吊られている
    g.strokeStyle = 'rgba(70,80,100,0.40)';
    g.lineWidth = Math.max(1, M()*0.010);
    g.beginPath();
    for (const x of [0.12, 0.30, 0.50, 0.70, 0.88]){
      g.moveTo(innerWidth*x, 0);
      g.lineTo(innerWidth*x + M()*0.02, trussY()-trussH()*0.5);
    }
    g.stroke();
    // チェーンモーター
    g.fillStyle = 'rgba(4,5,9,0.95)';
    for (const x of [0.30, 0.70]){
      rrect(innerWidth*x - M()*0.09, trussY()-trussH()*1.4,
            M()*0.18, trussH()*1.0, M()*0.03); g.fill();
    }
  }

  // ── ⑤ トラスと灯体。**光を遮る**
  if (heat > 0.06) rig(heat);


  if (flash > 0.01){
    g.fillStyle = 'rgba(255,255,255,'+(flash*0.16)+')';
    g.fillRect(0,0,innerWidth,innerHeight);
  }
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

function connect(){
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(proto+'://'+location.host+'/ws');
  ws.onopen = ()=>{ tag.style.opacity = 0; };
  ws.onmessage = e => { try { S = JSON.parse(e.data); } catch(_){} };
  ws.onclose = ()=>{ tag.style.opacity = 1; tag.textContent='reconnecting…';
                     setTimeout(connect, 1200); };
  ws.onerror = ()=> ws.close();
}
connect();

// ★試験から中身を確かめられるようにする。**画面を目で見るだけでは幾何は守れない**
window.__debug = {
  PANELS, CENTER_K, HORIZON, TRUSS_NEAR, LOOKS, BEAMS, UPS,
  // 遠近の倍率。u=0 が手前、u=1 が奥
  persp: (k, u) => k / (k + u*(1-k)),
  // 元画像の位置（射影）
  tex:   (k, u) => k*u / (1 - u*(1-k)),
  litColor: () => litColor(pal()),
  lensPos, pivotY, lensY,
  state: () => ({heat, hold, release, panels: panels.length}),
};
