// ── 降ってくるコード ───────────────────────────────
let LH = 0, ROWS = 0, FS = 0;
// ★3面ディスプレイ。**中央は正面、左右は奥へ向いている。**
//   字を傾けるだけでは遠近にならない（2026-09-13 失敗）。

const HORIZON = 0.72;
// ★左右のウォールは**客席側へ回り込む**（凹）。中央がいちばん奥。

// ★背面ウォールが主役。**袖は短い返し**（実際の会場もそう。2026-09-13）。

  {x0: 0.000, w: 0.170, side: 'left',  farScale: CENTER_K, dim: 0.62},
  {x0: 0.175, w: 0.650, side: null,    farScale: CENTER_K, dim: 1.00},

];
let panels = [];
// ★継ぎ目の位置は**1箇所で決める。** 0.825 と 0.828、0.175 と 0.172 を

function layout(){
  const dpr = Math.min(devicePixelRatio||1, 2);
  cv.width = innerWidth*dpr; cv.height = innerHeight*dpr;
  g.setTransform(dpr,0,0,dpr,0,0);
  // ★引き伸ばしの品質。既定は low で、台形に貼ると文字がぼける（2026-09-13 本人の指摘）
  g.imageSmoothingQuality = 'high';
  FS = Math.max(10, Math.min(17, innerWidth/110));
  LH = FS*1.34;
  ROWS = Math.ceil(innerHeight/LH)+3;
  panels = PANELS.map(pn => {
    const pw = innerWidth*pn.w;
    // ★裏キャンバスは「実寸のパネル」。奥のパネルは実際にはもっと横に長い
    const bw = pn.side ? pw/pn.farScale : pw;
    const n = Math.max(3, Math.floor(bw/(FS*9.0)));
    const cw = bw/n;
    // ★裏キャンバスの解像度。半分だと**貼るときに引き伸ばして文字が滲む**
    //   （2026-09-13 本人の指摘）。読ませたい中央だけ実寸で描く。

    off.width = Math.ceil(bw*RS); off.height = Math.ceil(innerHeight*RS);

    oc.imageSmoothingQuality = 'high';

      cols: Array.from({length:n}, (_,i)=>({

        hue: Math.random(),
        rows: Array.from({length:ROWS+3},
                         ()=>CODE[(Math.random()*CODE.length)|0]),

// ── スポットライト ───────────────────────────────
// ★ライトは**会場のトラスに吊られている。** 光源が宙に浮いていると嘘に見える
//   （2026-09-12 本人の指摘）。灯体を描いて、その**レンズから**光を出す。
//   Alan Walker のライブのように、拍で ぱぱぱっ と点く。
// ★実際のクラブ規模だと、1本のトラスにムービングヘッドは**4〜8台**。
//   9台は多すぎた（2026-09-12 本人の指摘）。6台にして、**左右対称に振る**
//   —— 実際の照明も対で組む。バラバラに振ると素人の仕込みに見える
const N_LIGHTS = 4;   // ★4台（2026-09-13 本人の指示）。偶数なので中央の1台は無い
const BEAMS = Array.from({length:N_LIGHTS}, (_,i)=>{
  const pair = i < N_LIGHTS/2 ? i : (N_LIGHTS-1-i);   // 対になる相手と同じ癖
  return {
    base: (pair/(N_LIGHTS/2))*Math.PI*0.7,
    sw:   0.85 + pair*0.28,
    hue:  pair/(N_LIGHTS/2),
    cx:   0.22 + (i/(N_LIGHTS-1))*0.56,   // 中央寄りに等間隔
    // ★中央からの位置を -1..+1 で持つ。**台数が変わっても対称のまま**
    //   （3台のとき中央が常に0で動かなかったのを、連続値にして解消）
    mirror: (i - (N_LIGHTS-1)/2) / ((N_LIGHTS-1)/2),
    on:   0,
    phase: pair % 2,
    // ★実際のムービングヘッドは**ゆらゆらしない。**
    //   キューの位置へ素早く動いて、次のキューまで止まっている。
    //   光の「ぱぱぱ」はシャッターで、灯体は静止したまま（2026-09-12 本人の問い）
    ang: 0, tgt: 0, vel: 0,
    hueDeg: 0,        // 点灯のたびに決める。**点いている間は変えない**
  };
});

// 照明の「キュー」。★実際の仕込みも、こういう型を組んで切り替える
// ★DJイベントの照明は速くて大振り。**小さく揺らさない**
const LOOKS = [
  (b,i,n)=> b.mirror * 0.62,                       // ハの字に開く
  (b,i,n)=> -b.mirror * 0.62,                      // 内側でクロス
  (b,i,n)=> 0,                                     // 全部まっすぐ下（止める）
  (b,i,n)=> (i/(n-1) - 0.5) * 1.30,                // 扇（ファン）
  (b,i,n)=> -(i/(n-1) - 0.5) * 1.30,               // 逆ファン
  (b,i,n)=> (i % 2 ? 1 : -1) * 0.55,               // 一つ置きに交互
  (b,i,n)=> b.mirror * 0.78,                       // 目一杯外へ
  (b,i,n)=> -0.30 + i*0.30,                        // 階段状にずらす
  // ★**全部が同じ方を向く**型。これが無いと、真ん中の1台がずっと動かない
  //   （左右対称の型だけだと、中央は常に角度0になる。2026-09-13 実測で発覚）
  (b,i,n)=> 0.58,                                  // 全部が右へ
  (b,i,n)=> -0.58,                                 // 全部が左へ
  (b,i,n)=> Math.sin(i*1.5) * 0.62,                // 波打つ
  // ★演者を狙う。**実際のライブは、まず演者を照らす。**
  //   実機は画面の中央下に立っている。そこへ全部を向ける（2026-09-13）
  (b,i,n)=> Math.atan2(0.5 - b.cx, 0.62) * 1.35,
  (b,i,n)=> Math.atan2(0.5 - b.cx, 0.62) * 1.35,   // 出やすくするため2つ入れる
];
let look = 0, lookAt = -1;

let swing = 0;
function newLook(n){
  // ★毎回ばらばらに動かさない。**型ごと切り替える**
  if (n === lookAt) return;
  lookAt = n;
  let k = look;
  while (k === look) k = (Math.random()*LOOKS.length)|0;
  look = k;
  // ★型の上に**全体の振り**を乗せる。左右対称の型でも中央が動く
  swing = (Math.random()*2 - 1) * 0.26;
  BEAMS.forEach((b,i)=> b.tgt = clampPan(LOOKS[look](b, i, BEAMS.length) + swing));
}
// ★垂直から±45度まで。**83度はほぼ水平で、ヘッドがヨークから横へ突き出る。**
//   光が根元から離れて見えていた原因（2026-09-13 本人の指摘）。
//   実際も、客席を照らすときはこのくらいの範囲で使う
const PAN_MAX = 0.80;
function clampPan(v){ return Math.max(-PAN_MAX, Math.min(PAN_MAX, v)); }
newLook(0);
let bar = 0;

// ★縮尺を決める。**画面の横幅を会場9mとみなす**（2026-09-12 本人の指摘）。
//   30cm角のトラスが画面幅の0.7%しかなく、針金のように細かった
const VENUE_W = 9.0;                     // 画面の横幅が何メートルか
function M(){ return innerWidth / VENUE_W; }          // 1メートルの画素数
// ★トラスは**壁より手前**にある。壁と同じ縮尺で描くと小さすぎて浮く。
//   手前のものは枠からはみ出すのが自然（2026-09-13 本人の指摘）
const TRUSS_NEAR = 1.06;                               // 壁に対する手前ぶんの倍率
function trussY(){ return Math.max(18, innerHeight*0.028); }   // ★上へ寄せる
function trussH(){ return M() * 0.30 * TRUSS_NEAR; }  // 箱トラス 30cm角
function braceP(){ return M() * 0.55 * TRUSS_NEAR; }
function rigLen(){ return M() * 0.44 * TRUSS_NEAR; }   // ★灯体だけ小さく  // ムービングヘッド 約55cm
// ★レンズ（光が出る口）の位置。**描く側と光る側で必ず同じ値を使う**
//   ばらばらに計算していたので、光が出る場所がずれていた（2026-09-12）
const BASE_Y = 0.42, BASE_H = 0.36, YOKE_H = 0.28, HEAD_H = 0.40;
function pivotY(){                     // ヨークの支点（ここを中心にヘッドが回る）
  return trussY() + trussH()*BASE_Y + rigLen()*(BASE_H + YOKE_H);
}
// ★レンズは**回った先**にある。ヘッドが向きを変えれば、光の出口も動く
//   （2026-09-13：横に潰して固定していたので、最初の姿勢のまま止まって見えた）
function lensPos(cx, ang){
  // ★canvas の rotate(a) は (0,r) を **(-sin(a)·r, cos(a)·r)** に写す
  //   （y軸が下向きなので、正の角度は時計回り）。
  //   +sin にしていたので、**横を向いた瞬間だけ反対側にずれていた。**
  //   真下（a=0）では一致するので、静止画では気づけない（2026-09-13 本人の指摘）
  const r = rigLen()*HEAD_H;
  return {x: cx - Math.sin(ang)*r, y: pivotY() + Math.cos(ang)*r};
}
function lensY(){ return pivotY() + rigLen()*HEAD_H; }   // 真下を向いたとき

function stepHeads(dt){
  // ★実際の灯体は、キューへ素早く動いて**止まる。** 少し行き過ぎて戻る（慣性）
  for (const b of BEAMS){
    // ★実際のムービングヘッドは速い。**0.2秒で振り切って止まる**
    //   （2026-09-12 本人の指摘：ゆるゆる揺れていた）
    // ★実機は大きく振ると0.5秒前後かかる。硬すぎると瞬間移動に見える
    //   （2026-09-13 本人の指摘：そんな高速に動かないだろ）
    const k = 46.0, damp = 12.5;
    b.vel += (b.tgt - b.ang) * k * dt;
    b.vel -= b.vel * damp * dt;
    b.ang += b.vel * dt;
  }
}

function trussRun(x0, y0, x1, y1, s, a){
  // ★トラスは1本の関数で描く。横も縦も同じ素材・同じ粒度・同じ太さ。
  //
  // ★**不透明で描く。** αで描くと、交差したところが二重になって透ける
  //   （2026-09-13 本人の指摘）。実体は実体として置く。
  // ★**中は塗らない。** 箱トラスは骨組みで、隙間から背景が見える。
  // ★素材は暗いまま。**明るさは光だまり（spill）だけから来る。**
  //   ここで明るくすると、一様に光って安っぽくなる
  const len = Math.hypot(x1-x0, y1-y0);
  if (len < 1) return;
  const ux = (x1-x0)/len, uy = (y1-y0)/len;
  const nx = -uy, ny = ux;
  const h = M()*0.30*s;
  const pipe = Math.max(1.2, M()*0.05*s);
  const bp = M()*0.55*s;
  const dim = 0.35 + 0.65*a;                     // 奥のものは沈む

  const rgb = (v) => 'rgb(' + Math.round(v[0]*dim) + ',' +
                              Math.round(v[1]*dim) + ',' +
                              Math.round(v[2]*dim) + ')';

  // ① 筋交い（ジグザグ＋垂直材）。**不透明**
  g.strokeStyle = rgb([11, 13, 17]);
  g.lineWidth = pipe*0.60;
  g.lineCap = 'round';
  g.beginPath();
  for (let d = 0; d < len; d += bp){
    const p0 = Math.min(d, len), p1 = Math.min(d+bp*0.5, len), p2 = Math.min(d+bp, len);
    const P = (q, side) => [x0+ux*q + nx*h/2*side, y0+uy*q + ny*h/2*side];
    const [ax,ay] = P(p0,-1), [bx,by] = P(p1, 1), [cx2,cy2] = P(p2,-1);
    g.moveTo(ax,ay); g.lineTo(bx,by); g.lineTo(cx2,cy2);
    const [vx,vy] = P(p1,-1);
    g.moveTo(bx,by); g.lineTo(vx,vy);
  }
  g.stroke();
  // 丸パイプの照り（細く、控えめに）
  g.strokeStyle = rgb([26, 31, 39]);
  g.lineWidth = pipe*0.16;
  g.stroke();

  // ② 弦材（丸いパイプ）。**不透明。** 断面の陰影で丸みを出す
  for (const side of [-1, 1]){
    const cx0 = x0 + nx*h/2*side, cy0 = y0 + ny*h/2*side;
    const cx1 = x1 + nx*h/2*side, cy1 = y1 + ny*h/2*side;
    const gr = g.createLinearGradient(cx0 - nx*pipe/2, cy0 - ny*pipe/2,
                                      cx0 + nx*pipe/2, cy0 + ny*pipe/2);
    gr.addColorStop(0,    rgb([34, 40, 50]));
    gr.addColorStop(0.30, rgb([14, 17, 22]));
    gr.addColorStop(1,    rgb([3, 4, 6]));
    g.strokeStyle = gr;
    g.lineWidth = pipe;
    g.beginPath(); g.moveTo(cx0,cy0); g.lineTo(cx1,cy1); g.stroke();
  }
  g.lineCap = 'butt';

  // ③ ★光だまり。**ここだけが明るさの源。** 当たったところだけ光る
  spill(() => {
    g.beginPath();
    g.moveTo(x0+nx*h/2, y0+ny*h/2); g.lineTo(x1+nx*h/2, y1+ny*h/2);
    g.lineTo(x1-nx*h/2, y1-ny*h/2); g.lineTo(x0-nx*h/2, y0-ny*h/2);
    g.closePath();
  }, (x0+x1)/2, Math.min(y0,y1) - h, Math.max(y0,y1) + h, 1.1);
}

function trussCorner(x, y, s, a){
  // ★角には継ぎ手が入る。**トラス同士は交差せず、ブロックで繋がる**
  const h = M()*0.30*s;
  const d2 = 0.35 + 0.65*a;
  g.fillStyle = 'rgb('+Math.round(12*d2)+','+Math.round(15*d2)+','+Math.round(20*d2)+')';
  rrect(x - h*0.58, y - h*0.58, h*1.16, h*1.16, h*0.14); g.fill();
  g.fillStyle = 'rgb('+Math.round(28*d2)+','+Math.round(33*d2)+','+Math.round(42*d2)+')';
  rrect(x - h*0.58, y - h*0.58, h*1.16, h*0.14, h*0.06); g.fill();
}

function drawTruss(a){
  const y = trussY(), OVER = innerWidth*0.06;
  trussRun(-OVER, y, innerWidth+OVER, y, TRUSS_NEAR, a);
}

function beams(t, p, energy, heat, dt){
  const ty = trussY(), L = rigLen();

  // ── 光の筋（加算）。★揺らさない。太さも色も、点いている間は動かさない
  g.globalCompositeOperation = 'lighter';
  for (const b of BEAMS){
    // ★シャッター。**灯体は止まったまま、光だけが刻む。** これが派手さの正体
    // ★減衰は**時間基準**。フレーム基準だと fps で点灯時間が変わる
    //   （2026-09-13：12fps と 60fps で全く違う見え方になっていた）
    b.on = Math.max(0, b.on - dt*2.2);
    b.pw = 0;
    // ★シャッターで刻む。**灯体は止まったまま、光だけがチカチカする。**
    //   これが DJ の現場の派手さの正体（2026-09-12 本人の指摘）
    const rate = 12 + 10*heat;                  // 1秒あたりの開閉
    const ph16 = (t*rate + b.phase*0.5) % 1;
    const shut = 0.55 + 0.45*Math.pow(1 - ph16, 1.6);
    const power = b.on * (0.55 + energy) * (0.45 + 0.55*shut);
    b.pw = power;                    // ★反射を描くために残す
    if (power < 0.012) continue;

    // ★上の吊り灯体は手に連動しない。**こすりに反応するのは下の2本だけ**
    //   （2026-09-12 本人の指摘）。上は仕込んだキュー通りに動く
    const a = b.ang;
    const hue = b.hueDeg;                       // ★灯体ごとに固定。churn させない
    const half = M()*0.115;                     // 出口の半径 11.5cm
    const spread = 0.125;                       // ★円錐。細い筋ではない（参考写真）★太く
    const far = innerHeight*1.5;

    const LP = lensPos(innerWidth*b.cx, a);
    g.save();
    g.translate(LP.x, LP.y);
    g.rotate(a);

    // ★光学に合わせる（2026-09-12 本人の指摘）
    //   ・**逆二乗則**：円錐が広がるので、断面あたりの強さは距離の二乗で落ちる
    //   ・**見えているのは空気中の散乱光**。だから縁が無い。幅の違う層を重ねて溶かす
    //   ・**中心は白飛びする**（彩度が落ちる）。外側ほど色が乗る
    //   ・遠いほど広がって薄い → 層ごとに減衰の効き方を変える
    // ★ヘイズが濃い。**光は太い塊になる**（参考画像）。細い筋ではない
    // ★境目を消す。**幅と濃さをガウス分布に沿わせて10枚重ねる**
    //   （2026-09-13 本人の指摘：各光のボーダーが見えていた）
    // ★灯体を4台に増やしたので、1台あたりの層を10→8枚に。
    //   幅と濃さの比を取り直して、**溶け具合と明るさの合計は変えない**（2026-09-13）
    // ★光量を上げた（2026-09-13 本人の指示）。層ごとの比は保ったまま 1.5 倍
    for (const [wm, am, sat, lig] of [[6.40, 0.0219, 58, 40],
                                      [4.57, 0.0365, 70, 45],
                                      [3.27, 0.0605, 82, 51],
                                      [2.34, 0.1004, 89, 58],
                                      [1.67, 0.1667, 92, 66],
                                      [1.19, 0.2768, 90, 76],
                                      [0.85, 0.4596, 84, 87],
                                      [0.61, 0.7634, 76, 98]]){
      const gg = g.createLinearGradient(0, 0, 0, far);
      // ★逆二乗を階段で近似する。d0 は「光源からこの距離で半分」の目安
      for (const s of [0, 0.06, 0.14, 0.26, 0.45, 0.70, 1.0]){
        const d = 1 + s*7.0;                       // 距離（出口を1とする）
        gg.addColorStop(s, 'hsla('+hue+','+sat+'%,'+lig+'%,'
                      + (am*power/(d*d)) + ')');
      }
      g.fillStyle = gg;
      g.beginPath();
      g.moveTo(-half*wm, 0); g.lineTo(half*wm, 0);
      g.lineTo(far*spread*wm, far); g.lineTo(-far*spread*wm, far);
      g.closePath(); g.fill();
    }

    // レンズ。★明るい点は目でも滲む（ブルーム）。芯は白、外へ色が出る
    for (const [r, a2, s2, l2] of [[5.0, 0.16, 90, 55],
                                   [2.2, 0.52, 70, 78],
                                   [0.9, 1.00, 25, 97]]){
      const gl = g.createRadialGradient(0,0,0, 0,0, half*r);
      gl.addColorStop(0,   'hsla('+hue+','+s2+'%,'+l2+'%,'+(a2*power)+')');
      gl.addColorStop(0.5, 'hsla('+hue+','+(s2+8)+'%,'+(l2-16)+'%,'+(a2*0.28*power)+')');
      gl.addColorStop(1,   'hsla('+hue+',95%,55%,0)');
      g.fillStyle = gl;
      g.beginPath(); g.arc(0,0, half*r, 0, 6.2832); g.fill();
    }
    g.restore();
  }
  g.globalCompositeOperation = 'source-over';

}

// ── 会場のテープライト（柱の支柱＋ディスプレイ上端の横トラス）────
// ★**実機のテープに流しているのと同じ配列**（S.leds）をそのまま映す。
//   画面側でパターンを再実装しない。実装が2つあると、必ずどちらかがずれる
//   （2026-09-13 本人の要望：目の前の物理LEDと背景のスタジオLEDを連動させて
//    リアル感と奥行きを出す）。
//
// 場所：★**網目（筋交い）ではなく支柱に這わせる**（2026-09-13 本人の指摘）。
//   trussRun の弦材と同じ式で位置を出す。1本の骨組みにつき左右2本。
//
// 経路：左の柱を**下から上**、ディスプレイ上端を**左から右**、右の柱を**上から下**。
//   ★どの区間も**テープ全体**を映す。区間ごとに切ると1区間4粒になって
//   chase が飛び飛びに見える。全部映せば、光が会場をぐるりと回って見える
//
// 光り方：★1本の線で描かない（安っぽい）。**幅の違う帯を重ねる。**
//   ・断面の山（中心が白く飛び、外へ色が出る）→ 立体感
//   ・**スモークが焚いてあるので、テープからじんわり外まで薄く光る**
//   ビームの円錐と同じ考え方。幅と濃さを段階的に変えて縁を溶かす
// ★上端の横トラスだけを上へ逃がす量（トラスの奥行き何個ぶんか）。
//   **柱は動かさない。** 両端が重なって見えたのは横トラスだけ（2026-09-13 本人の指摘）
const TOP_RUN_LIFT = 1.15;

// ★加算で重ねるので、**合計が1を超えると芯が白く飛んで、周りまで洗い流す**
//   （2026-09-13：合計2.24 で会場全体が滲んだ）。合計は1.3前後に収める。
//   いちばん外の帯がにじみの正体。18倍は広すぎた
// ── バーストモード（右の音量ゲージ）─────────────────────
// ★盛り上がりの頂点で、人が手でゲージを上げる。**段差を作らない。**
//   0.70 で点火、そこから連続で強くなり、1.00 で花火（2026-09-13 本人の指示）
//   ★閾値と式は Python 側（constants.burst_amount）と同じにすること
const BURST_ON = 0.70, BURST_MAX = 0.995;
// ★色を赤へ寄せる。**強いほど赤一色に。**
//   これが無いと、色相の散らし（±170度）と時間回転に負けて、
//   赤いはずのバーストが黄緑になる（2026-09-13 実際にそうなった）
function burstHue(h){
  const b = burstAmt();
  if (b <= 0) return h;
  const target = 6;                                  // 赤
  const d = ((h - target + 540) % 360) - 180;        // -180..180
  return (target + d * (1 - 0.86*b) + 360) % 360;
}
function burstAmt(){
  const v = S.burst || 0;
  return v < BURST_ON ? 0 : Math.min(1, (v - BURST_ON) / (1 - BURST_ON));
}

const TAPE_W = [[8.00, 0.016], [5.20, 0.026], [3.50, 0.042],
                [2.40, 0.068], [1.70, 0.110], [1.20, 0.190], [1.00, 0.420]];
function tapeRuns(y0, y1){
  // ★骨組みの位置と1箇所で揃える。**テープだけ別の数字で置かない**
  const kc = CENTER_K;
  const hh = M()*0.30*kc*0.85;
  const yP = y0 + hh*0.6;                     // 柱の上端（★動かさない）
  const yT = yP - hh*TOP_RUN_LIFT;            // ★上の横トラスだけ上げる
  const xL = innerWidth*JOINT_L, xR = innerWidth*JOINT_R;
  return [
    {x0: xL, y0: y1, x1: xL, y1: yP},         // 左の柱：下から上
    {x0: xL, y0: yT, x1: xR, y1: yT},         // 上端の横：左から右
    {x0: xR, y0: yP, x1: xR, y1: y1},         // 右の柱：上から下
  ];
}
function tape(y0, y1, kc, gx){
  const c = gx || g;               // ★検算では偽の canvas を渡す
  const L = S.leds;
  if (!L || L.length < 2) return;
  const n = L.length;
  const s  = kc*0.85;                             // ★柱の trussRun と同じ縮尺
  const inset = M()*0.30*s*0.75;                  // ★連結部の手前で終わる
  const off = M()*0.30*s/2;                       // ★弦材の位置。同じ式から出す
  const w  = Math.max(1.2, M()*0.05*s) * 0.78;    // テープは弦材より少し細い
  const GAIN = 4.4;                               // 実機は max_brightness で絞ってある

  const mk = (len, white) => {
    const gd = c.createLinearGradient(0, 0, len, 0);
    for (let i=0;i<n;i++){
      const v = L[i] || [0,0,0];
      // ★白飛びは**そのLEDの明るさに比例**させる。
      //   消えている粒まで白く持ち上げると、テープ全体が灰色に浮く
      const lum = Math.max(v[0], v[1], v[2]) / 255;
      const f = (k) => { const b = Math.min(255, v[k]*GAIN);
                         return (b*(1 - white*lum) + 255*white*lum) | 0; };
      gd.addColorStop(i/(n-1), 'rgb('+f(0)+','+f(1)+','+f(2)+')');
    }
    return gd;
  };

  c.globalCompositeOperation = 'lighter';
  for (const r0 of tapeRuns(y0, y1)){
    // ★端を連結部の手前で切る。**コーナーブロックの下は光らない**
    //   （2026-09-13 本人の指摘：連結部が光って、離れて見えていた）
    const full = Math.hypot(r0.x1-r0.x0, r0.y1-r0.y0);
    const ux = (r0.x1-r0.x0)/full, uy = (r0.y1-r0.y0)/full;
    const cut = Math.min(inset, full*0.30);
    const r = {x0: r0.x0 + ux*cut, y0: r0.y0 + uy*cut,
               x1: r0.x1 - ux*cut, y1: r0.y1 - uy*cut};
    const len = Math.hypot(r.x1-r.x0, r.y1-r.y0);
    if (len < 2) continue;
    const body = mk(len, 0), hot = mk(len, 0.55);
    c.save();
    c.translate(r.x0, r.y0);
    c.rotate(Math.atan2(r.y1-r.y0, r.x1-r.x0));
    for (const sgn of [-1, 1]){
      c.fillStyle = body;
      for (const [wm, am] of TAPE_W){
        c.globalAlpha = am;
        c.fillRect(0, sgn*off - w*wm/2, len, w*wm);
      }
      // ★芯。白く飛ぶところ。**これが無いと平らな帯に見える**
      c.fillStyle = hot;
      c.globalAlpha = 0.45;
      c.fillRect(0, sgn*off - w*0.18, len, w*0.36);
    }
    c.restore();
  }
  c.globalAlpha = 1;
  c.globalCompositeOperation = 'source-over';
}

// ── 横トラスと柱の連結部（コーナーブロック）───────────
// ★実物のトラスは、直交する部材を**角のブロック（コーナーキューブ）**で繋ぐ。
//   ここは板とボルトの塊なので**光らない。** 逆にここが光っていると、
//   横材と柱が宙で離れて見える（2026-09-13 本人の指摘）。
//   **不透明で暗く置いて、繋がっていることを見せる**
function trussCorner(x, yTop, yBot, s){
  const d = M()*0.30*s;
  const w = d*1.06;
  const y0 = yTop - d*0.62, y1 = yBot + d*0.10;
  // 影。**ブロックの裏の光を殺す**
  g.fillStyle = 'rgb(2,3,4)';
  rrect(x - w/2 - 1, y0 - 1, w + 2, (y1-y0) + 2, d*0.14); g.fill();
  // 板。断面の陰影だけ付ける（素地は暗いまま）
  const gr = g.createLinearGradient(x - w/2, 0, x + w/2, 0);
  gr.addColorStop(0,    'rgb(26,30,38)');
  gr.addColorStop(0.32, 'rgb(12,14,19)');
  gr.addColorStop(1,    'rgb(4,5,7)');
  g.fillStyle = gr;
  rrect(x - w/2, y0, w, y1-y0, d*0.12); g.fill();
  // ★光だまり。**周りの骨組みと同じ関数で受ける。**
  //   ここだけ反射が無いと、同じ素材に見えず浮く（2026-09-13 本人の指摘）
  //   板なので、はみ出さないように**板の形で切り抜く**
  spill(() => { rrect(x - w/2, y0, w, y1-y0, d*0.12); g.clip(); },
        x, y0, y1, 1.35);
  // ★面のてかり。板は平らなので、当たった光が**面ごと**返る
  {
    const L = litColor(pal());
    if (L.pow > 0.05){
      g.save();
      rrect(x - w/2, y0, w, y1-y0, d*0.12); g.clip();
      g.globalCompositeOperation = 'lighter';
      const sh = g.createLinearGradient(x - w/2, y0, x + w/2, y1);
      sh.addColorStop(0,    'hsla('+L.hue+',70%,72%,'+(0.16*Math.min(1,L.pow))+')');
      sh.addColorStop(0.45, 'hsla('+L.hue+',75%,60%,'+(0.05*Math.min(1,L.pow))+')');
      sh.addColorStop(1,    'hsla('+L.hue+',75%,55%,0)');
      g.fillStyle = sh;
      g.fillRect(x - w/2, y0, w, y1-y0);
      g.globalCompositeOperation = 'source-over';
      g.restore();
    }
  }
  // ボルト。★4隅に小さく。**大きく描くと玩具に見える**
  //   頭は金属なので、いちばん強く光を返す
  const L2 = litColor(pal());
  const br = Math.max(0.8, d*0.055);
  for (const px of [-w*0.33, w*0.33])
    for (const py of [y0 + d*0.22, y1 - d*0.22]){
      g.fillStyle = 'rgb(38,44,54)';
      g.beginPath(); g.arc(x + px, py, br, 0, 6.2832); g.fill();
      if (L2.pow > 0.05){
        g.globalCompositeOperation = 'lighter';
        g.fillStyle = 'hsla('+L2.hue+',60%,80%,'+(0.45*Math.min(1,L2.pow))+')';
        g.beginPath(); g.arc(x + px - br*0.3, py - br*0.3, br*0.6, 0, 6.2832); g.fill();
        g.globalCompositeOperation = 'source-over';
      }
    }
}


// ── 100% の花火（ステージ前縁の噴水花火）──────────────
// ★「下から噴射」なので、打ち上げではなく**舞台用のゲルブ**。
//   実物は火薬の粒が上へ吹き上がって、重力で落ちながら消える。
//   ・粒は**線分**で描く（点だと止まって見える。尾があると速さが出る）
//   ・**1本のパスにまとめて1回で描く。** 粒ごとに描くと iPad が止まる
//   ・色は白熱→橙→赤。金属花火は温度が下がる順に色が変わる
const SPARKS = [];
const SPARK_MAX = 240;
function gerbX(){
  // ★噴出口は下からのスポットライトと同じ位置。**装置は増やさない**
  return UPS.map(u => u.cx);
}
function stepSparks(dt, amt){
  if (amt >= 1){
    // ★吹き上げ。強さではなく**満で全開**。ここは段階を作らない
    for (const cx of gerbX()){
      const n = Math.min(9, SPARK_MAX - SPARKS.length);
      for (let i=0;i<n;i++){
        const a = (-Math.PI/2) + (Math.random()-0.5)*0.42;   // ほぼ真上
        const sp = (0.9 + Math.random()*0.75) * innerHeight*1.35;
        SPARKS.push({x: innerWidth*cx + (Math.random()-0.5)*M()*0.18,
                     y: innerHeight*1.01,
                     vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
                     t: 0, life: 0.75 + Math.random()*0.75});
      }
    }
  }
  const G = innerHeight*1.9;                    // 重力
  for (let i=SPARKS.length-1; i>=0; i--){
    const s = SPARKS[i];
    s.px = s.x; s.py = s.y;
    s.t += dt;
    s.vy += G*dt;
    s.vx *= (1 - 1.1*dt);                       // 空気抵抗
    s.x += s.vx*dt; s.y += s.vy*dt;
    if (s.t >= s.life || s.y > innerHeight*1.15) SPARKS.splice(i,1);
  }
}
function drawSparks(){
  if (!SPARKS.length) return;
  g.globalCompositeOperation = 'lighter';
  g.lineCap = 'round';
  // ★寿命で3群に分けて、群ごとに1回で描く。**粒ごとに描かない**
  const bands = [[0.00, 0.33, '#fff6ea', 3.0, 0.95],
                 [0.33, 0.68, '#ffb347', 2.2, 0.80],
                 [0.68, 1.01, '#ff4a22', 1.5, 0.55]];
  for (const [lo, hi, col, w, a] of bands){
    g.beginPath();
    let any = false;
    for (const s of SPARKS){
      const u = s.t / s.life;
      if (u < lo || u >= hi || s.px === undefined) continue;
      g.moveTo(s.px, s.py); g.lineTo(s.x, s.y);
      any = true;
    }
    if (!any) continue;
    g.strokeStyle = col;
    g.globalAlpha = a;
    g.lineWidth = w;
    g.stroke();
  }
  // 噴出口の白熱。★根元がいちばん明るい
  for (const cx of gerbX()){
    const x = innerWidth*cx, y = innerHeight*1.01, r = M()*0.9;
    const gp = g.createRadialGradient(x, y, 0, x, y, r);
    gp.addColorStop(0,   'rgba(255,246,232,0.75)');
    gp.addColorStop(0.4, 'rgba(255,150,60,0.22)');
    gp.addColorStop(1,   'rgba(255,60,20,0)');
    g.fillStyle = gp; g.globalAlpha = 1;
    g.beginPath(); g.arc(x, y, r, 0, 6.2832); g.fill();
  }
  g.globalAlpha = 1;
  g.lineCap = 'butt';
  g.globalCompositeOperation = 'source-over';
}

// ── バーストの光沢 ────────────────────────────────
// ★「赤く光沢」。**面が濡れたように見える**のは、光源の像が細く走るから。
//   全面を赤で塗ると彩度が上がるだけで、光沢にはならない
function burstGloss(amt){
  if (amt <= 0) return;
  g.globalCompositeOperation = 'lighter';
  // ① 会場全体に赤が回る（下ほど強い＝床からの照り返し）
  const gv = g.createLinearGradient(0, 0, 0, innerHeight);
  gv.addColorStop(0,   'hsla(2,95%,52%,'+(0.05*amt)+')');
  gv.addColorStop(0.55,'hsla(6,95%,50%,'+(0.10*amt)+')');
  gv.addColorStop(1,   'hsla(14,95%,54%,'+(0.20*amt)+')');
  g.fillStyle = gv;
  g.fillRect(0, 0, innerWidth, innerHeight);
  // ② 走る光沢。★斜めに細く。**ゆっくり動かすと「艶」に見える**
  const u = (t*0.45) % 1.6 - 0.3;
  const gx = g.createLinearGradient(innerWidth*(u-0.22), 0,
                                    innerWidth*(u+0.22), innerHeight);
  gx.addColorStop(0,    'hsla(10,100%,60%,0)');
  gx.addColorStop(0.45, 'hsla(14,100%,72%,'+(0.16*amt)+')');
  gx.addColorStop(0.5,  'hsla(30,100%,86%,'+(0.26*amt)+')');
  gx.addColorStop(0.55, 'hsla(14,100%,72%,'+(0.16*amt)+')');
  gx.addColorStop(1,    'hsla(10,100%,60%,0)');
  g.fillStyle = gx;
  g.fillRect(0, 0, innerWidth, innerHeight);
  g.globalCompositeOperation = 'source-over';
}

function rrect(x, y, w, h, r){
  // 角の丸い箱。★実機に角張ったところは少ない
  const rr = Math.min(r, w/2, h/2);
  g.beginPath();
  g.moveTo(x+rr, y);
  g.arcTo(x+w, y,   x+w, y+h, rr);
  g.arcTo(x+w, y+h, x,   y+h, rr);
  g.arcTo(x,   y+h, x,   y,   rr);
  g.arcTo(x,   y,   x+w, y,   rr);
  g.closePath();
}

function rig(heat){
  // ── 灯体とトラスの実体。★線は引かない。**黒い塊として置く**
  //   ★一番手前。奥から：有機ELパネル → 空気中の光 → トラスと灯体
  const ty = trussY(), L = rigLen();
  const fade = Math.min(1, heat*1.6);
  drawTruss(fade);
  const ink = 'rgba(3,4,7,'+(0.93*fade + 0.06)+')';
  const lit = 'rgba(120,140,175,'+(0.10*fade)+')';   // 上面がわずかに光を拾う

  for (const b of BEAMS){
    const a = b.ang;                       // ★ビームと同じ角度
    const pan = clampPan(a);
    g.save();
    g.translate(innerWidth*b.cx, ty);
    g.fillStyle = ink;

    // ★クランプ（トラスを挟む金具）。丸みのある小さな塊
    rrect(-L*0.16, -trussH()*0.62, L*0.32, trussH()*0.95, L*0.06); g.fill();

    // ★ベース（本体）。角の丸い箱。ここにパンのモーターが入っている
    const by = trussH()*BASE_Y;
    rrect(-L*0.38, by, L*0.76, L*BASE_H, L*0.12); g.fill();
    // 上面のわずかな照り返し
    g.fillStyle = lit;
    rrect(-L*0.38, by, L*0.76, L*0.08, L*0.04); g.fill();
    g.fillStyle = ink;

    g.translate(0, by + L*BASE_H);
    // ★ヨークは横に潰さない。回るのはヘッド（次の rotate(a)）

    // ★ヨーク。**Uの字の腕が支点を越えて伸び、腕の中の軸受けでヘッドを挟む。**
    //   実機の構造（moving head の特許・製品構成より）:
    //     ・ベースの中のパンシャフトがヨークごと回す
    //     ・ヨークの腕の中にチルトシャフトの軸受けがあり、ヘッドを両側から支える
    //     ・**腕とヘッドの隙間は極小**（小さく作るため）
    //   腕が支点で終わっていたので、ヘッドが外れて見えていた（2026-09-13）
    const PY = L*YOKE_H;                 // 支点の高さ（ローカル）
    const AX = L*0.335;                  // 腕の位置（ヘッド半幅より外）
    g.lineCap = 'round';
    g.strokeStyle = ink;
    g.lineWidth = L*0.115;
    g.beginPath();
    for (const s2 of [-1, 1]){
      g.moveTo(s2*L*0.36, -L*0.02);
      g.quadraticCurveTo(s2*L*0.40, PY*0.55, s2*AX, PY + L*0.07);
    }
    g.stroke();

    // ★ヘッドは腕の間で、支点まわりに回る
    g.save();
    g.translate(0, PY);
    g.rotate(a);
    const HL = L*HEAD_H, HB = -L*0.15, HW = L*0.235;   // 腕(0.335)より内側
    g.fillStyle = ink;
    g.beginPath();
    g.moveTo(-HW, HB);
    g.quadraticCurveTo(-HW*1.06, HL*0.55, -HW*0.86, HL);
    g.lineTo( HW*0.86, HL);
    g.quadraticCurveTo( HW*1.06, HL*0.55,  HW, HB);
    g.closePath();
    g.fill();
    g.beginPath(); g.ellipse(0, HB, HW, L*0.095, 0, 0, 6.2832); g.fill();
    // レンズ面。★ここが光の出口
    g.beginPath(); g.ellipse(0, HL, HW*0.85, L*0.055, 0, 0, 6.2832); g.fill();
    g.restore();

    // ★軸受けのボス。腕の側にあり、ヘッドを両側から支える（暗い金属。白くしない）
    g.fillStyle = 'rgb('+Math.round(28*fade+3)+','+Math.round(33*fade+4)+','
                + Math.round(42*fade+6)+')';
    for (const s2 of [-1, 1]){
      g.beginPath(); g.arc(s2*AX, PY, L*0.072, 0, 6.2832); g.fill();
    }
    g.fillStyle = 'rgb('+Math.round(52*fade+4)+','+Math.round(60*fade+5)+','
                + Math.round(74*fade+7)+')';
    for (const s2 of [-1, 1]){
      g.beginPath(); g.arc(s2*AX, PY, L*0.024, 0, 6.2832); g.fill();   // シャフト端
    }
    g.restore();   // ★灯体ごとの save を戻す。**抜けていて毎フレーム積み上がっていた**
  }
  // ★ブラインダーをやめた（2026-09-13：足しすぎて壊れたので引いた）

  g.lineCap = 'butt';

  // ── ★レンズの発光。**筐体を描いたあとに乗せる。**
  //   先に描いていたので、黒い筐体に塗り潰されて「光源が黒いまま」だった
  g.globalCompositeOperation = 'lighter';
  for (const b of BEAMS){
    const pw = b.pw || 0;
    if (pw < 0.02) continue;
    const LP = lensPos(innerWidth*b.cx, b.ang);
    const cx = LP.x, ly = LP.y, hue = b.hueDeg, half = M()*0.115;
    // ★大きな白玉にしない。**芯は小さく、周りは色**（2026-09-13 本人の指摘）
    for (const [r, a2, s2, l2] of [[1.9, 0.06, 92, 50],
                                   [0.85,0.34, 86, 68],
                                   [0.30,1.00, 45, 97]]){
      const gl = g.createRadialGradient(cx, ly, 0, cx, ly, half*r);
      gl.addColorStop(0,   'hsla('+hue+','+s2+'%,'+l2+'%,'+(a2*pw)+')');
      gl.addColorStop(0.5, 'hsla('+hue+','+(s2+8)+'%,'+(l2-16)+'%,'+(a2*0.28*pw)+')');
      gl.addColorStop(1,   'hsla('+hue+',95%,55%,0)');
      g.fillStyle = gl;
      g.beginPath(); g.arc(cx, ly, half*r, 0, 6.2832); g.fill();
    }
  }
  g.globalCompositeOperation = 'source-over';

  // ── 反射。★光ると、自分の筐体とトラスがその色を拾う
  //   （2026-09-12 本人の指摘：真っ黒のままだった）
  g.globalCompositeOperation = 'lighter';
  for (const b of BEAMS){
    const pw = b.pw || 0;
    if (pw < 0.02) continue;
    const LP2 = lensPos(innerWidth*b.cx, b.ang);
    const hue = b.hueDeg, cx = LP2.x, ly = LP2.y;

    // ① 灯体まわりの散り。**レンズの近くがいちばん明るい**
    // ★大きな塊にしない。**いちばん明るい点は筒の先**（2026-09-13 本人の指摘）
    const sp = g.createRadialGradient(cx, ly, 0, cx, ly, L*0.42);
    sp.addColorStop(0,   'hsla('+hue+',85%,74%,'+(0.30*pw)+')');
    sp.addColorStop(0.4, 'hsla('+hue+',90%,60%,'+(0.18*pw)+')');
    sp.addColorStop(1,   'hsla('+hue+',90%,50%,0)');
    g.fillStyle = sp;
    g.beginPath(); g.arc(cx, ly, L*0.42, 0, 6.2832); g.fill();

    // ② トラスに当たる。★**手前にあるので強く出る**（2026-09-13 本人の指摘）
    const h = trussH(), pipe = M()*0.05, top = ty - h/2, bot = ty + h/2;
    // ★光が当たったところだけ。そこから**ぼんやり暗くなる**
    const w = L*1.1;
    // ★自分の真上のパイプがいちばん明るい。**帯で一様に光らせない**
    for (const [cy, kk] of [[top, 0.8], [bot, 1.5]]){
      const gr = g.createRadialGradient(cx, cy, 0, cx, cy, w*0.9);
      gr.addColorStop(0,   'hsla('+hue+',80%,84%,'+(0.40*pw*kk)+')');
      gr.addColorStop(0.4, 'hsla('+hue+',88%,66%,'+(0.13*pw*kk)+')');
      gr.addColorStop(1,   'hsla('+hue+',90%,58%,0)');
      g.fillStyle = gr;
      g.fillRect(cx-w, cy-pipe*0.5, w*2, pipe);
    }
  }
  g.globalCompositeOperation = 'source-over';
}

// ★実機は画面の**中央下**に立つ（実物の配置・2026-09-13）。
//   真後ろに置くと隠れるので、**実機の外側**から立ち上げて、実機を挟む
const UPS = [
  {cx: 0.26, hue: 0.00, side: -1, ang: 0, tgt: 0, vel: 0, base: 0},
  {cx: 0.74, hue: 0.55, side:  1, ang: 0, tgt: 0, vel: 0, base: 0},
];
// ★下の灯体も首を振る。固定だと置物に見える（2026-09-13 本人の指摘）
const UP_LOOKS = [
  (u)=> u.side*0.55, (u)=> -u.side*0.55, (u)=> 0,
  (u)=> u.side*0.85, (u)=> -0.35, (u)=> 0.35,
];
let upLook = 0;
function newUpLook(){
  let k = upLook;
  while (k === upLook) k = (Math.random()*UP_LOOKS.length)|0;
  upLook = k;
  UPS.forEach(u => u.tgt = UP_LOOKS[upLook](u));
}
newUpLook();
function stepUps(dt){
  for (const u of UPS){
    u.vel += (u.tgt - u.ang) * 46.0 * dt;
    u.vel -= u.vel * 12.5 * dt;
    u.ang += u.vel * dt;
  }
}

function stageWell(){
  // ★実機は白い。**背後が明るいと顔が沈む。** 中央下だけ暗く落として浮かせる
  const cx = innerWidth*0.5, cy = innerHeight*1.02;
  const r = Math.min(innerWidth*0.42, innerHeight*0.85);
  const gr = g.createRadialGradient(cx, cy, 0, cx, cy, r);
  gr.addColorStop(0,   'rgba(0,0,0,0.86)');
  gr.addColorStop(0.55,'rgba(0,0,0,0.55)');
  gr.addColorStop(1,   'rgba(0,0,0,0)');
  g.fillStyle = gr;
  // ★途中から塗ると、その境目に横線が出る。**画面全体に塗る**
  g.fillRect(0, 0, innerWidth, innerHeight);
}

function spill(clip, objX, yTop, yBot, gain){
  // ★物に当たる光。**線ではなく、まだら。**
  //   光は1点から来るので、当たるのは面の一部だけ。そこから四方に落ちる
  g.save();
  clip();
  g.globalCompositeOperation = 'lighter';
  // ★下からの光も物に当たる。上だけ見ていた（2026-09-13 本人の指摘）
  const sources = [
    ...BEAMS.map(b => ({pw: b.pw||0, hue: b.hueDeg,
                        x: lensPos(innerWidth*b.cx, b.ang).x
                           + Math.tan(b.ang)*(innerHeight-lensY())*0.55,
                        up: false})),
    ...UPS.map(u => ({pw: u.pw||0, hue: u.hueDeg, x: u.x||0, up: true})),
  ];
  for (const b of sources){
    const pw = b.pw || 0;
    if (pw < 0.03) continue;
    const hx = b.x;
    const d = Math.abs(hx - objX) / (M()*2.0);
    const k = (gain||1) * pw / (1 + d*d*2.2);       // ★逆二乗で落ちる
    if (k < 0.02) continue;
    // ★上からの光は上寄り、下からの光は下寄りに当たる
    const py = b.up ? yTop + (yBot - yTop)*0.86 : yTop + (yBot - yTop)*0.12;
    const r  = M()*1.5*(0.55 + pw);
    const gp = g.createRadialGradient(hx, py, 0, hx, py, r);
    gp.addColorStop(0,   'hsla('+b.hue+',80%,84%,'+(0.38*k)+')');
    gp.addColorStop(0.35,'hsla('+b.hue+',85%,66%,'+(0.14*k)+')');
    gp.addColorStop(1,   'hsla('+b.hue+',85%,55%,0)');
    g.fillStyle = gp;
    g.fillRect(objX - r*1.6, yTop, r*3.2, yBot - yTop);
  }
  g.globalCompositeOperation = 'source-over';
  g.restore();
}

function litColor(p){
  // ★いま出ている光の平均。床も天井も柱も、この色を拾う
  let hue = 0, w = 0;
  for (const b of BEAMS){ const q = b.pw || 0; hue += b.hueDeg*q; w += q; }
  for (const u of UPS){   const q = u.pw || 0; hue += (u.hueDeg||0)*q; w += q; }
  return {hue: burstHue(w > 0 ? hue/w : p.h), pow: Math.min(1.4, w)};
}

function wash(p, amt){
  // ★実際のライブは部屋全体が一色に染まる。局所的なビームだけでは足りない
  if (amt < 0.02) return;
  const L = litColor(p);
  g.globalCompositeOperation = 'lighter';
  const gr = g.createRadialGradient(innerWidth*0.5, trussY(), 0,
                                    innerWidth*0.5, trussY(), innerHeight*1.5);
  gr.addColorStop(0,   'hsla('+L.hue+',92%,52%,'+(0.26*amt)+')');
  gr.addColorStop(0.45,'hsla('+L.hue+',95%,42%,'+(0.15*amt)+')');
  gr.addColorStop(1,   'hsla('+L.hue+',95%,34%,'+(0.06*amt)+')');
  g.fillStyle = gr;
  g.fillRect(0, 0, innerWidth, innerHeight);
  g.globalCompositeOperation = 'source-over';
}

function uplights(t, p, amt, jog){
  // ★ステージ前縁に置いた**アップライト**。こすっている間だけ立ち上がる。
  //   上の吊り灯体と同じ質にする（層を重ねて縁を溶かす・逆二乗・揺らさない）
  if (amt < 0.02) return;
  const y = innerHeight*1.022;      // ★実体と同じ高さ
  const far = innerHeight*1.5;
  for (const u of UPS){
    const cx = innerWidth*u.cx;
    // ★仕込んだ首振り＋演者の手。手が勝つが、離せば首振りに戻る
    const a = u.ang + jog*1.05;
    const pw = amt * (0.35 + 0.65*Math.abs(jog));
    const hue = burstHue((p.h + 170 + u.hue*150) % 360);
    const half = M()*0.13;
    u.pw = pw; u.hueDeg = hue; u.x = cx;      // 反射で使う

    g.globalCompositeOperation = 'lighter';
    g.save();
    g.translate(cx, y);
    g.rotate(Math.PI + a);                    // 上へ向ける
    // ★層を重ねて縁を溶かす。逆二乗で落とす
    // ★上と同じ滑らかさに。境目を作らない
    // ★光量を上げた（2026-09-13）。上の灯体と同じ倍率
    for (const [wm, am, sat, lig] of [[5.40, 0.0165, 58, 44],
                                      [4.38, 0.0254, 68, 47],
                                      [3.38, 0.0392, 77, 52],
                                      [2.56, 0.0602, 84, 58],
                                      [1.92, 0.0926, 89, 64],
                                      [1.41, 0.1425, 90, 72],
                                      [1.03, 0.2195, 88, 79],
                                      [0.75, 0.3377, 83, 87],
                                      [0.54, 0.5198, 75, 96]]){
      const gg = g.createLinearGradient(0, 0, 0, far);
      for (const s2 of [0, 0.04, 0.09, 0.16, 0.25, 0.37, 0.52, 0.72, 1.0]){
        const d = 1 + s2*6.0;
        gg.addColorStop(s2, 'hsla('+hue+','+sat+'%,'+lig+'%,'+(am*pw/(d*d))+')');
      }
      g.fillStyle = gg;
      g.beginPath();
      g.moveTo(-half*wm, 0); g.lineTo(half*wm, 0);
      g.lineTo(far*0.075*wm, far); g.lineTo(-far*0.075*wm, far);
      g.closePath(); g.fill();
    }
    g.restore();
    // レンズのブルーム
    for (const [r, a2, s2, l2] of [[4.0, 0.25, 88, 58], [1.8, 0.72, 66, 82],
                                   [0.8, 1.00, 20, 99]]){
      const gl = g.createRadialGradient(cx, y, 0, cx, y, half*r);
      gl.addColorStop(0, 'hsla('+hue+','+s2+'%,'+l2+'%,'+(a2*pw)+')');
      gl.addColorStop(1, 'hsla('+hue+',95%,55%,0)');
      g.fillStyle = gl;
      g.beginPath(); g.arc(cx, y, half*r, 0, 6.2832); g.fill();
    }
    g.globalCompositeOperation = 'source-over';
  }
}

function uplightBodies(t, p, jog){
  // ★実体は**常に置く。** 消えていて、こすった瞬間に現れるのはおかしい
  //   （2026-09-13 本人の指摘）。角度に応じて筐体も傾く
  // ★床に沈める。**筒の上が僅かに覗くくらい**（2026-09-13 本人の指摘）
  const y = innerHeight*1.022;
  for (const u of UPS){
    const cx = innerWidth*u.cx;
    const a = u.ang + jog*1.05;
    const w = M()*0.34, h = M()*0.24;
    g.save();
    g.translate(cx, y);
    g.rotate(a);                       // ★向きに合わせて傾く
    // 台座（床に接する）
    g.fillStyle = 'rgb(6,7,11)';
    rrect(-w*0.62, h*0.30, w*1.24, h*0.42, M()*0.02); g.fill();
    // 筐体
    const face = g.createLinearGradient(-w/2, 0, w/2, 0);
    face.addColorStop(0,    'rgb(8,9,12)');
    face.addColorStop(0.22, 'rgb(24,27,33)');
    face.addColorStop(0.6,  'rgb(12,14,18)');
    face.addColorStop(1,    'rgb(4,5,8)');
    g.fillStyle = face;
    rrect(-w/2, -h*0.62, w, h, M()*0.03); g.fill();
    // レンズ面（上を向く）
    g.fillStyle = 'rgb(14,16,21)';
    g.beginPath(); g.ellipse(0, -h*0.62, w*0.40, h*0.13, 0, 0, 6.2832); g.fill();
    g.restore();
    // ★当たった光を拾う
    spill(() => { g.beginPath();
                  rrect(cx - w*0.7, y - h*0.9, w*1.4, h*1.7, M()*0.03); },
          cx, y - h, y + h*0.8, 1.1);
  }
}

function fireBeams(n){
  // ★拍ごとに違う組が点く。**毎回同じだと機械に見える**
  bar = (bar + 1) % 4;
  // ★全部を同時に点けない。**面になった瞬間、光ではなく霧になる**
  newLook(n);                                       // ★毎拍、位置を変える
  if (n % 2 === 0) newUpLook();                     // 下は2拍ごと
  const heavy = (n % 4 === 0);                      // 4拍に1回は全灯
  const pl = pal();
  for (const b of BEAMS){
    b.tgt = clampPan(LOOKS[look](b, BEAMS.indexOf(b), BEAMS.length) + swing);
    // ★色は点けるときに決める。**光っている最中に色が回るのは嘘**
    b.hueDeg = burstHue((pl.h + b.hue*70 + ((Math.random()*3)|0)*40) % 360);
    // ★毎拍、全部が点く。強弱で表情をつける。**消えている時間が長いと「光らない」**
    b.on = heavy ? 1 : (b.phase === bar ? 1 : 0.72);
  }
}

let prev = performance.now(), t = 0, freeBeat = 0, freeN = 0, frameNo = 0;
let beatAcc = 0, localN = 0;
// ★床のパネルを拍ごとにランダムで光らせる（2026-09-13 本人の要望）。
//   毎フレーム選び直すとチラつくので、**拍で選んで、消えるまで持たせる**
const FLOOR_COLS = 10, FLOOR_ROWS = 6;
let floorLit = [];
function litFloor(hue){
  const k = 2 + ((Math.random()*4)|0);
  for (let i=0;i<k;i++){
    floorLit.push({c: (Math.random()*FLOOR_COLS)|0,
                   r: (Math.random()*FLOOR_ROWS)|0,
                   hue: burstHue((hue + (Math.random()*60-30)) % 360), on: 1});
  }
  if (floorLit.length > 14) floorLit.splice(0, floorLit.length - 14);   // ★iPadの描画予算
}
// ★動いていないときは静かに、動いた瞬間に爆発する。**差が無いと見せ場が無い**
//   （2026-09-12 本人の指摘）。急に切り替えず、少しだけ滑らせる
let heat = 0;
// ── スクラッチの気持ち（2026-09-12 本人の問い）──────────────
// **こすっている間は「溜め」。曲を手で掴んで止めている。客の視線が手元に集まる。**
// **離した瞬間が「放つ」。** ゆらゆらさせるだけでは、この緊張と解放が出ない。
//   溜め  → 光を数本に絞り、手の向きへ一斉に向ける。コードは止まる。暗く沈む
//   解放  → 全灯・白フラッシュ・コードが走り出す
let hold = 0, prevHand = 0, release = 0;
let drawFails = 0;
const fps = {n:0, at:0, last:0};
// ★フレームが来なくなったら知らせる。**黙って止まるのがいちばん困る**
setInterval(() => {
  const el = document.getElementById('hud');
  if (!el) return;
  if (performance.now() - fps.last > 1500){
    el.style.color = '#ff6b8a';
    el.textContent = '描画が止まっています\nfps=0';
  }
}, 1000);
let wsOpen = false;
function draw(now){
  // ★状態を画面に出す。**こちらからは端末の中が見えない**
  fps.n++; fps.last = now;
  if (now - fps.at > 500){
    const el = document.getElementById('hud');
    if (el){ el.style.color = '#7fe3ff'; el.textContent =
      Math.round(fps.n*1000/(now-fps.at)) + ' fps  mode=' + (S.mode||'?')
      + '  heat=' + heat.toFixed(2) + '  ws=' + (wsOpen ? 'ON' : 'OFF')
      + '  beat=' + localN + '\n' + VERSION; }
    fps.n = 0; fps.at = now;
  }
  try { drawInner(now); }
  catch (e){
    if (++drawFails < 3) window.__err('描画で落ちました: ' + (e && e.message));
  }
  requestAnimationFrame(draw);
}

function drawInner(now){
  const dt = Math.min(0.05, (now-prev)/1000); prev = now; t += dt;
  // ★拍は**画面側で刻む。** サーバの n が止まると照明が一度も切り替わらない
  //   （2026-09-13：n=0 のまま固まり「動かない」になった）。
  //   曲があればその BPM に、無ければ 120 で自走する
  {
    const bpm = (S.bpm && S.bpm > 20) ? S.bpm : 120;
    beatAcc += dt * (bpm / 60);
    while (beatAcc >= 1){ beatAcc -= 1; localN++; pulse = 1; fireBeams(localN);
                          litFloor(pal().h); }
  }
  if (S.drop) flash = 1;
  // ★レコードを触っている＝演者が動かしている。**それも「動いている」**
  //   （2026-09-12：静止中はライトを消しているので、こすっても見えなかった）
  // ★この演出は**演奏中だけ**（2026-09-12 本人の指示）。
  //   静かなときにこすっても、ライトは出さない
  //   ★拍ではなくモードで見る。こすると音楽が止まって拍が消えるため
  const playing = S.mode === 'dj' || S.dancing || !!S.talk;
  const hand = playing ? (S.jogw || 0) : 0;
  // ★離した瞬間を捕まえる。**放つのは、掴んでいた手が開いたとき**
  if (prevHand > 0.5 && hand <= 0.15 && hold > 0.25){ release = 1; flash = 1; fireBeams(0); }
  prevHand = hand;
  // ★こすりは速い。**溜めずに、その場で反応する**（2026-09-12 本人の指摘）
  hold += ((hand > 0.15 ? 1 : 0) - hold) * dt * (hand > 0.15 ? 30.0 : 7.0);
  release = Math.max(0, release - dt*1.6);
  const live = playing || hand > 0.15;
  // ★立ち上がりは速く、落ちるのはゆっくり。**盛り上がりは急に、余韻は残す**
  // ★モードは**強さ**を変えるだけ。止まって見える状態を作らない
  //   （2026-09-13：OFF が暗く遅すぎて「壊れている」と見えた）
  const floor0 = 0.30;                       // 静かなときの下限
  heat += ((live ? 1 : floor0) - heat) * dt * (live ? 6.5 : 1.6);
  heat = Math.max(heat, floor0);
  heat = Math.max(heat, hand*0.85);      // ★手の分は即座に効かせる

  pulse = Math.max(0, pulse - dt*3.4);
  flash = Math.max(0, flash - dt*2.0);

  // ★バーストの強さ。**ここで1回だけ出して、全部が同じ値を見る**
  const burst = burstAmt();
  if (burst > 0) heat = 1.0;                      // 照明は振り切る
  const p = pal();
  // ★静かなとき 0.10 前後、盛り上がると 1.6 くらいまで振れる
  const energy = (0.10 + heat*0.75 + pulse*0.70*heat + flash*0.6) * (1 + burst*0.9);

  // 背景。★静かなときは色を回さない。回ると落ち着かない
  g.fillStyle = 'hsl('+burstHue((p.h + t*26*heat*(1-burst)) % 360)+','
              + (40 + 45*heat)+'%,'+(0.6 + energy*1.6)+'%)';
  g.fillRect(0,0,innerWidth,innerHeight);
  // ★静かなときはライトを出さない。**コードがゆっくり流れているだけでちょうどいい**
  //   （2026-09-12 本人の指摘）。動き出したら吊り込まれる
  stepHeads(dt);
  stepUps(dt);

  const hy = innerHeight*HORIZON;

  // ── 夜空。★**いちばん奥なので最初に描く。**
  //   後から描いていたので、壁の上を塗り潰して一直線に切っていた（2026-09-13）
  //   空は画面いっぱいに広がり、その手前に壁が立つ
  {
    const skyH = innerHeight;                 // ★画面いっぱい。壁が手前で隠す
    // 地平近くはうっすら明るい（街明かり）。**真っ黒な空は嘘**
    const sg = g.createLinearGradient(0, 0, 0, skyH);
    sg.addColorStop(0,   'rgb(2,3,8)');
    sg.addColorStop(0.7, 'rgb(5,7,16)');
    sg.addColorStop(1,   'rgb(10,13,26)');
    g.fillStyle = sg;
    g.fillRect(0, 0, innerWidth, skyH);

    // 星。★下ほど少なく見える（空気が厚い）
    for (const st of stars){
      const y = st.y * (hy*0.95);   // 星は地平より上だけ
      const depth = 0.35 + 0.65*(1 - st.y);
      const tw = 0.75 + 0.25*Math.sin(t*1.6 + st.tw);
      const a = st.m * depth * tw * (1 - Math.min(0.75, heat*0.75));  // 照明が強いと星は負ける
      // ★灯体を増やしたぶんの描画予算を、見えない星から回す。
      //   照明が強いときの薄い星は、そもそも目に入らない（2026-09-13）
      if (a < 0.075) continue;
      g.fillStyle = 'rgba(214,226,255,'+a+')';
      const r = Math.max(0.6, st.m*1.7);
      g.fillRect(st.x*innerWidth, y, r, r);
    }

  }

  // ── ② 会場の奥：3面のディスプレイ。**裏で正面から描いて、台形に貼る**
  const TAIL = 13 + 9*heat;   // ★描画数を抑える（iPad が止まる）
  // ★バーストでコードが走る。**倍率で効かせる**（足すと止まっているとき変になる）
  const flow = ((0.22 + heat*2.4 + energy*6.0) * (1 - hold*0.45) + release*14.0)
             * (1 + burst*7.0);

  frameNo++;
  for (const pn of panels){
    // ★袖は暗いので、2フレームに1回でよい。**中央だけ毎フレーム**
    if (pn.side && (frameNo % 2)) { /* 前のフレームの絵をそのまま貼る */ }
    else {
    const o = pn.octx;
    o.setTransform(pn.rs,0,0,pn.rs,0,0);
    o.globalCompositeOperation = 'source-over';
    const bgv = o.createLinearGradient(0, 0, 0, innerHeight);
    const bl = 1.5 + 3.5*heat;
    bgv.addColorStop(0,    'hsla('+p.h+',60%,'+bl+'%,0)');
    bgv.addColorStop(0.04, 'hsla('+p.h+',60%,'+bl+'%,1)');
    bgv.addColorStop(0.96, 'hsla('+p.h+',60%,'+bl+'%,1)');
    bgv.addColorStop(1,    'hsla('+p.h+',60%,'+bl+'%,0)');
    o.fillStyle = bgv;
    o.fillRect(0, 0, pn.bw, innerHeight);
    o.textBaseline = 'top';
    o.font = '600 '+FS+'px ui-monospace,SFMono-Regular,Menlo,monospace';
    o.globalCompositeOperation = 'lighter';
    for (const c of pn.cols){
      c.off += dt * c.spd * flow;
      if (c.off > ROWS) c.off -= ROWS;
      for (let r=0; r<ROWS; r++){
        const d = (c.off - r + ROWS) % ROWS;
        if (d > TAIL) continue;
        const txt = c.rows[r];
        if (!txt) continue;
        // ★バースト中は散らしも回転も止める。**赤で押し切る**
        const hue = burstHue(
          (p.h + c.hue*(30+140*heat)*(1-burst*0.85)
             + (p.h2-p.h)*(d/TAIL) + t*(2+56*heat)*(1-burst)) % 360);
        const a = Math.max(0, 1 - d/TAIL) * (0.085 + 1.05*heat + energy*0.45)
                * (1 - hold*0.25) * (1 + release*0.9);
        if (d < 0.9){
          o.shadowColor = 'hsl('+hue+',100%,72%)';
          o.shadowBlur = (0 + 30*heat + 34*energy) * 0.34;   // ★芯を潰さない
          o.fillStyle = heat > 0.35 ? p.core
                      : 'hsla('+hue+',45%,'+(26 + 56*heat)+'%,0.42)';
        } else {
          o.shadowColor = 'hsl('+hue+',100%,62%)';
          o.shadowBlur = (0 + 14*heat + 20*energy) * 0.34;
          o.fillStyle = 'hsla('+hue+','+(45 + 55*heat)+'%,'
                      + (15 + 55*heat + 16*(1-d/TAIL))+'%,'+a+')';
        }
        o.fillText(txt, c.x, r*LH);
        if (Math.random() < 0.0004 + 0.006*heat + pulse*0.06*heat){
          c.rows[r] = CODE[(Math.random()*CODE.length)|0];
        }
      }
    }
    o.shadowBlur = 0;

    // ★LEDウォールは**500×500mm のキャビネットの集合**（レンタルの業界標準）。
    //   継ぎ目のグリッドが薄く見えるのが本物。一枚板だと嘘になる（2026-09-13 調査）
    // ★パネルの上下端を溶かす。**自分で光る矩形の縁が、横のボーダーになる**
    //   光を強くするほど目立っていた（2026-09-13 本人の指摘）
    o.globalCompositeOperation = 'destination-out';
    const vh = innerHeight*0.035;
    const vt = o.createLinearGradient(0, 0, 0, vh);
    vt.addColorStop(0, 'rgba(0,0,0,1)'); vt.addColorStop(1, 'rgba(0,0,0,0)');
    o.fillStyle = vt; o.fillRect(0, 0, pn.bw, vh);
    const vb = o.createLinearGradient(0, innerHeight-vh, 0, innerHeight);
    vb.addColorStop(0, 'rgba(0,0,0,0)'); vb.addColorStop(1, 'rgba(0,0,0,1)');
    o.fillStyle = vb; o.fillRect(0, innerHeight-vh, pn.bw, vh);

    o.globalCompositeOperation = 'source-over';
    const cab = M()*0.5;                       // キャビネット 500mm
    o.strokeStyle = 'rgba(0,0,0,0.55)';
    o.lineWidth = Math.max(1, M()*0.012);      // 継ぎ目 約12mm
    o.beginPath();
    for (let x=cab; x<pn.bw; x+=cab){ o.moveTo(x, 0); o.lineTo(x, innerHeight); }
    for (let y=cab; y<innerHeight; y+=cab){ o.moveTo(0, y); o.lineTo(pn.bw, y); }
    o.stroke();
    // ★キャビネットごとの輝度差。実物は必ず少しばらつく
    o.globalCompositeOperation = 'lighter';
    const nx = Math.ceil(pn.bw/cab), ny = Math.ceil(innerHeight/cab);
    for (let iy=0; iy<ny; iy++){
      for (let ix=0; ix<nx; ix++){
        const v = ((ix*7 + iy*13) % 11) / 11;   // 決め打ちの散らばり（毎フレーム変えない）
        if (v > 0.72){
          o.fillStyle = 'hsla('+p.h+',60%,60%,'+(0.010 + 0.016*heat)+')';
          o.fillRect(ix*cab, iy*cab, cab, cab);
        }
      }
    }
    o.globalCompositeOperation = 'source-over';
    }

    // ★**射影変換**で貼る。等間隔に切って高さだけ縮めるのはアフィンで、遠近ではない
    //   （2026-09-13：垂れ幕に見えていた原因）。
    //   奥へ行くほど**横方向も詰まる**。それが遠近のいちばん強い手がかり。
    //
    //     高さの倍率  s(u) = k / (k + u(1-k))
    //     元画像の位置 su   = k·u / (1 - u(1-k))     （k = 奥端の倍率）
    const k = pn.farScale;
    if (!pn.side){
      // ★中央は正面かつ**最奥**。一様に縮める（傾いていないので歪まない）
      const dh = innerHeight * k, dy = hy - hy * k;
      g.globalAlpha = pn.dim;
      g.drawImage(pn.off, 0, 0, pn.bw*pn.rs, innerHeight*pn.rs, pn.px, dy, pn.pw, dh);
      g.globalAlpha = 1;
    } else {
      // ★左右は**外側が手前**。u=0 が外（手前・高さ1）、u=1 が中央寄り（奥・高さk）
      const N = 40;
      const su = (a)=> k*a / (1 - a*(1-k));
      const mirror = pn.side === 'left';   // 左は画面の左端が手前
      for (let i=0; i<N; i++){
        const u0 = i/N, u1 = (i+1)/N;
        // ★u0=0（画面の端＝手前）で 1、u0=1（中央寄り＝奥）で k。
        //   前は 1/k になっていて、**奥へ行くほど広がっていた**（2026-09-13）
        const s0 = k / (k + u0*(1-k));
        const t0 = su(u0), t1 = su(u1);
        const sx = (mirror ? t0 : 1-t1) * pn.bw * pn.rs;
        const sw = Math.max(1, (t1-t0) * pn.bw * pn.rs);
        const dx = pn.px + (mirror ? u0 : (1-u1)) * pn.pw;
        // ★+1 は隙間埋め。**大きくすると隣と二重に写って滲む**
      const dw = pn.pw/N + 0.6;
        const dh = innerHeight * s0;
        const dy = hy - hy * s0;
        g.globalAlpha = pn.dim * (1 - 0.34*u0);      // 奥ほど暗い
        g.drawImage(pn.off, sx, 0, sw, innerHeight*pn.rs, dx, dy, dw, dh);
      }
      g.globalAlpha = 1;
    }
  }

  // ── 継ぎ目の柱。★**吊りトラスと同じ素材・同じ粒度**（本人の指摘）。
  //   奥にあるので縮尺は壁に合わせる
  const kc = CENTER_K, ch = innerHeight*kc, cy = hy - hy*kc;
  {
    for (const x0 of [JOINT_L, JOINT_R]){
      const x = innerWidth*x0;
      const hh = M()*0.30*kc*0.85;
      trussRun(x, cy + hh*0.6, x, cy + ch, kc*0.85, 0.85);   // 角の分だけ下から
      // ★光だまり。線ではなく、当たった高さから四方へ落ちる
      spill(() => { g.beginPath();
                    g.rect(x - M()*0.16*kc, cy, M()*0.32*kc, ch); },
            x, cy, cy + ch, 1.25);
    }
    // ★ディスプレイ上端の横トラス。柱の上端どうしを繋ぐ（2026-09-13 本人の要望）
    {
      const hh = M()*0.30*kc*0.85, yT = cy + hh*0.6 - hh*TOP_RUN_LIFT;
      trussRun(innerWidth*JOINT_L, yT, innerWidth*JOINT_R, yT, kc*0.85, 0.85);
      spill(() => { g.beginPath();
                    g.rect(innerWidth*JOINT_L, yT - hh*0.8,
                           innerWidth*(JOINT_R-JOINT_L), hh*1.6); },
            innerWidth*(JOINT_L+JOINT_R)/2, yT - hh, yT + hh, 1.25);
    }
    tape(cy, cy + ch, kc);
    // ★テープの**あと**に置く。連結部は光を遮る側
    {
      const hh = M()*0.30*kc*0.85;
      for (const x0 of [JOINT_L, JOINT_R])
        trussCorner(innerWidth*x0, cy + hh*0.6 - hh*TOP_RUN_LIFT,
                    cy + hh*0.6, kc*0.85);
    }
  }

  // ★ウォール上端の横トラスと袖のトラスをやめた（2026-09-13：足しすぎて壊れたので引いた）

  // ── 床。★奥行きの手がかりで**いちばん強いのは床の収束線**（2026-09-13）。
  //   これが無いと、パネルが宙に浮いて部屋に見えない
  {
    const kc = CENTER_K;
    const backY = hy + (innerHeight - hy) * kc;    // 奥の壁の足元
    g.fillStyle = 'rgba(3,4,8,0.97)';
    g.beginPath();
    g.moveTo(0, innerHeight);
    g.lineTo(innerWidth, innerHeight);
    g.lineTo(innerWidth*WALL_R, backY);
    g.lineTo(innerWidth*WALL_L, backY);
    g.closePath(); g.fill();

    // ★床の目地。**手前ほど間隔が広い**。これが遠近を確定させる
    g.strokeStyle = 'hsla('+p.h+',60%,60%,'+(0.06 + 0.14*heat)+')';
    g.lineWidth = Math.max(1, M()*0.008);
    g.beginPath();
    for (let i=1; i<FLOOR_ROWS; i++){
      const u = i/FLOOR_ROWS;
      const yy = backY + (innerHeight - backY) * (u*u);   // 二乗で手前ほど広く
      const s = (yy - backY) / (innerHeight - backY);
      const xl = innerWidth*WALL_L * (1-s) + 0 * s;
      const xr = innerWidth*WALL_R * (1-s) + innerWidth * s;
      g.moveTo(xl, yy); g.lineTo(xr, yy);
    }
    // 消失点へ向かう線
    for (let ci=1; ci<FLOOR_COLS; ci++){ const a = ci/FLOOR_COLS;
      g.moveTo(innerWidth*(WALL_L + (WALL_R-WALL_L)*a), backY);
      g.lineTo(innerWidth*a, innerHeight);
    }
    g.stroke();

  // ★床の映り込みをやめた（2026-09-13：足しすぎて壊れたので引いた）

    // ★床のパネルが拍ごとに光る。**マス目に沿って四角く光る**
    g.globalCompositeOperation = 'lighter';
    for (const f of floorLit){
      f.on = Math.max(0, f.on - dt*2.4);
      if (f.on < 0.02) continue;
      // 手前ほど広い（床の目地と同じ割り方）
      const u0 = f.r / FLOOR_ROWS, u1 = (f.r + 1) / FLOOR_ROWS;
      const y0 = backY + (innerHeight - backY) * (u0*u0);
      const y1 = backY + (innerHeight - backY) * (u1*u1);
      const s0 = (y0 - backY) / (innerHeight - backY);
      const s1 = (y1 - backY) / (innerHeight - backY);
      const lerp = (s, a2, b2) => (innerWidth*a2)*(1-s) + b2*s;
      const xl0 = lerp(s0, WALL_L, 0),         xr0 = lerp(s0, WALL_R, innerWidth);
      const xl1 = lerp(s1, WALL_L, 0),         xr1 = lerp(s1, WALL_R, innerWidth);
      const a0 = f.c / FLOOR_COLS, a1 = (f.c + 1) / FLOOR_COLS;
      const gp2 = g.createLinearGradient(0, y0, 0, y1);
      // ★光量を上げた（2026-09-13 本人の指示）。1.9倍、芯の明度も上げる
      gp2.addColorStop(0,   'hsla('+f.hue+',92%,66%,'+(0.19*f.on)+')');
      gp2.addColorStop(0.5, 'hsla('+f.hue+',88%,78%,'+(0.49*f.on)+')');
      gp2.addColorStop(1,   'hsla('+f.hue+',92%,62%,'+(0.11*f.on)+')');
      g.fillStyle = gp2;
      g.beginPath();
      g.moveTo(xl0 + (xr0-xl0)*a0, y0); g.lineTo(xl0 + (xr0-xl0)*a1, y0);
      g.lineTo(xl1 + (xr1-xl1)*a1, y1); g.lineTo(xl1 + (xr1-xl1)*a0, y1);
      g.closePath(); g.fill();
    }
    floorLit = floorLit.filter(f => f.on >= 0.02);
    g.globalCompositeOperation = 'source-over';

    // ★ビームが床に落ちる。**当たったところが光の色になる**
    const L2 = litColor(p);
    g.globalCompositeOperation = 'lighter';
    for (const b of BEAMS){
      const pw2 = b.pw || 0;
      if (pw2 < 0.03) continue;
      const ly2 = lensY();
      const hx = lensPos(innerWidth*b.cx, b.ang).x
               + Math.tan(b.ang) * (innerHeight - ly2) * 0.55;
      const rx = M()*0.85*(1 + 1.8*pw2), ry = rx*0.26;
      const gp = g.createRadialGradient(hx, innerHeight*0.93, 0,
                                        hx, innerHeight*0.93, rx);
      gp.addColorStop(0,   'hsla('+b.hueDeg+',90%,80%,'+(0.55*pw2)+')');
      gp.addColorStop(0.5, 'hsla('+b.hueDeg+',95%,62%,'+(0.18*pw2)+')');
      gp.addColorStop(1,   'hsla('+b.hueDeg+',95%,50%,0)');
      g.fillStyle = gp;
      g.save(); g.translate(hx, innerHeight*0.93); g.scale(1, ry/rx);
      g.beginPath(); g.arc(0, 0, rx, 0, 6.2832); g.fill(); g.restore();
    }
    g.globalCompositeOperation = 'source-over';

    // 壁と床の境目が、いちばん光を拾う
    const gr = g.createLinearGradient(0, backY - M()*0.12, 0, backY + M()*0.10);
    gr.addColorStop(0, 'hsla('+p.h+',80%,62%,0)');
    gr.addColorStop(0.6, 'hsla('+p.h+',80%,68%,'+(0.10 + 0.22*heat)+')');
    gr.addColorStop(1, 'hsla('+p.h+',80%,62%,0)');
    g.fillStyle = gr;
    g.fillRect(innerWidth*(WALL_L-0.015), backY - M()*0.12, innerWidth*(WALL_R-WALL_L+0.03), M()*0.22);
  }

  // ── ② 空気中の光。パネルの手前を通る
  if (heat > 0.06) beams(t, p, energy, heat, dt);

  // ── ③ 部屋全体が染まる
  wash(p, heat);

  // ── 機材（スピーカースタックとサブ）。★手前にあるので、部屋の色を乗せたあとに描く
  {
    for (const [cx, dir] of [[0.115, 1], [0.885, -1]]){
      const x = innerWidth*cx, w = M()*0.60, hgt = M()*2.05;
      const yTop = innerHeight*0.99 - hgt;
      const topH = hgt*0.62, subY = yTop + topH, subH = hgt*0.38;
      const sw = w*1.30;

      // トップ。★箱なので面ごとに明るさが違う
      const face = g.createLinearGradient(x - w/2, 0, x + w/2, 0);
      face.addColorStop(0,    'rgb(9,10,13)');
      face.addColorStop(0.18, 'rgb(26,28,33)');
      face.addColorStop(0.55, 'rgb(14,15,19)');
      face.addColorStop(1,    'rgb(5,6,8)');
      g.fillStyle = face;
      rrect(x - w/2, yTop, w, topH, M()*0.025); g.fill();

      // グリル。★細かいメッシュ
      g.save();
      rrect(x - w/2 + M()*0.045, yTop + M()*0.05,
            w - M()*0.09, topH - M()*0.10, M()*0.012); g.clip();
      g.fillStyle = 'rgba(0,0,0,0.55)';
      g.fillRect(x - w/2, yTop, w, topH);
      g.fillStyle = 'rgba(70,76,88,0.16)';
      for (let yy = yTop + M()*0.05; yy < yTop + topH; yy += Math.max(3, M()*0.032)){
        g.fillRect(x - w/2, yy, w, Math.max(1, M()*0.008));
      }
      g.restore();

      // サブ。★床置きなので上面が見える
      const sface = g.createLinearGradient(x - sw/2, 0, x + sw/2, 0);
      sface.addColorStop(0,    'rgb(7,8,11)');
      sface.addColorStop(0.16, 'rgb(22,24,29)');
      sface.addColorStop(0.6,  'rgb(11,12,16)');
      sface.addColorStop(1,    'rgb(4,5,7)');
      g.fillStyle = sface;
      rrect(x - sw/2, subY, sw, subH, M()*0.025); g.fill();
      g.fillStyle = 'rgba(40,45,55,0.35)';
      g.beginPath();
      g.moveTo(x - sw/2, subY); g.lineTo(x + sw/2, subY);
      g.lineTo(x + sw/2 - M()*0.05, subY - M()*0.05);
      g.lineTo(x - sw/2 + M()*0.05, subY - M()*0.05);
      g.closePath(); g.fill();
      // ウーファー。★落とし込みなので縁に影
      const wr = M()*0.21, wy = subY + subH*0.52;
      const wg = g.createRadialGradient(x, wy - wr*0.25, wr*0.1, x, wy, wr);
      wg.addColorStop(0,   'rgb(24,26,31)');
      wg.addColorStop(0.6, 'rgb(10,11,14)');
      wg.addColorStop(1,   'rgb(2,3,5)');
      g.fillStyle = wg;
      g.beginPath(); g.arc(x, wy, wr, 0, 6.2832); g.fill();
      g.strokeStyle = 'rgba(70,78,92,0.30)';
      g.lineWidth = Math.max(1, M()*0.010);
      g.beginPath(); g.arc(x, wy, wr*0.98, 0, 6.2832); g.stroke();

      // ★光は面の一部にしか当たらない。線で光らせない
      spill(() => {
        g.beginPath();
        rrect(x - w/2, yTop, w, topH, M()*0.025);
        rrect(x - sw/2, subY, sw, subH, M()*0.025);
      }, x, yTop, yTop + hgt, 1.0);
    }
  }

  // ── 下からの光。★機材より**手前**（ステージ前縁に置く）
  burstGloss(burst);                    // ★赤い光沢は空気の色。実体より奥
  uplights(t, p, playing ? hold : 0, S.jog || 0);
  uplightBodies(t, p, S.jog || 0);      // ★実体は常に置く

  // ── ④ 実機の居場所を暗く残す（白い顔を沈ませない）

  // ── トラスの吊り。★空に浮かない
  {
    // 吊り。★トラスは空に浮かない。ワイヤーで上から吊られている
    g.strokeStyle = 'rgba(70,80,100,0.40)';
    g.lineWidth = Math.max(1, M()*0.010);
    g.beginPath();
    for (const x of [0.12, 0.30, 0.50, 0.70, 0.88]){
      g.moveTo(innerWidth*x, 0);
      g.lineTo(innerWidth*x + M()*0.02, trussY()-trussH()*0.5);
    }
    g.stroke();
    // チェーンモーター
    g.fillStyle = 'rgba(4,5,9,0.95)';
    for (const x of [0.30, 0.70]){
      rrect(innerWidth*x - M()*0.09, trussY()-trussH()*1.4,
            M()*0.18, trussH()*1.0, M()*0.03); g.fill();
    }
  }

  // ── ⑤ トラスと灯体。**光を遮る**
  if (heat > 0.06) rig(heat);

  // ── ⑥ 花火。★**いちばん手前。** 実際に舞台前縁から吹き上がるので、
  //   トラスにも灯体にも隠されない（2026-09-13 本人の指示：100%で噴射）
  stepSparks(dt, burst >= 1 ? 1 : 0);
  drawSparks();


  if (flash > 0.01){
    g.fillStyle = 'rgba(255,255,255,'+(flash*0.16)+')';
    g.fillRect(0,0,innerWidth,innerHeight);
  }
}
requestAnimationFrame(draw);

function connect(){
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(proto+'://'+location.host+'/ws');
  ws.onopen = ()=>{ tag.style.opacity = 0; wsOpen = true; };
  ws.onmessage = e => { try { S = JSON.parse(e.data); } catch(_){} };
  ws.onclose = ()=>{ wsOpen = false; tag.style.opacity = 1; tag.textContent='reconnecting…';
                     setTimeout(connect, 1200); };
  ws.onerror = ()=> ws.close();
}
connect();

// ★試験から中身を確かめられるようにする。**画面を目で見るだけでは幾何は守れない**
window.__debug = {
  PANELS, CENTER_K, HORIZON, TRUSS_NEAR, LOOKS, BEAMS, UPS, PAN_MAX,
  // 遠近の倍率。u=0 が手前、u=1 が奥
  persp: (k, u) => k / (k + u*(1-k)),
  // 元画像の位置（射影）
  tex:   (k, u) => k*u / (1 - u*(1-k)),
  litColor: () => litColor(pal()),
  lensPos, pivotY, lensY, stepHeads, rigLen, trussY, trussH,
  litFloor, floorPanels: () => floorLit, FLOOR_COLS, FLOOR_ROWS,
  tape, tapeRuns, TOP_RUN_LIFT, trussCorner, JOINT_L, JOINT_R, M,
  burstAmt, burstHue, BURST_ON, pal, BURST_PAL, sparks: () => SPARKS,
  beamHues: () => BEAMS.map(b=>b.hueDeg), fireBeams,
  setBurst: (v)=>{ S.burst = v; },
  setLeds: (v)=>{ S.leds = v; },
  blinderX: () => { const a=[]; for(let i=0;i<BEAMS.length-1;i++)
      a.push((BEAMS[i].cx+BEAMS[i+1].cx)/2);
    a.push(BEAMS[0].cx-0.14, BEAMS[BEAMS.length-1].cx+0.14);
    return a.filter(x=>x>0.02&&x<0.98); },
  state: () => ({heat, hold, release, panels: panels.length}),
};
