<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>この机の上の地図</title>
<style>
  :root{--ink:#06080c;--ink2:#0d1219;--line:#232c39;--text:#e6ecf7;--dim:#8d9bb2;--faint:#5b687e;
   --fw:#ffb347;--net:#79b8ff;--body:#3ee39b;--voice:#c874ff;--show:#ff8fb1;
   --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
   --sans:"Zen Kaku Gothic New",-apple-system,"Hiragino Sans",sans-serif}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--ink);color:var(--text);font-family:var(--sans);overflow:hidden;
   -webkit-font-smoothing:antialiased}
  #view{position:fixed;inset:0}
  svg{width:100%;height:100%;display:block}

  /* ★強調は2クラスだけ。増やさない */
  .part{transition:opacity .55s ease}
  .dim .part:not(.hot){opacity:.13}
  .hot .glow{opacity:1}
  .glow{opacity:0;transition:opacity .55s ease}

  .flow{stroke-dasharray:7 9;animation:mv 1.1s linear infinite;opacity:0;transition:opacity .5s}
  .hot .flow,.showflow .flow{opacity:.95}
  @keyframes mv{to{stroke-dashoffset:-16}}
  @media (prefers-reduced-motion:reduce){.flow{animation:none}.part,.glow{transition:none}}

  /* ★図の上に文字を寝かせない。**札にして、下に置く** */
  #head{position:fixed;left:20px;bottom:calc(18px + env(safe-area-inset-bottom));
   max-width:min(620px,70vw);padding:14px 18px 15px;background:#0c1118;z-index:4;
   border:1px solid var(--line);border-left:3px solid #7ee0d0;border-radius:0 12px 12px 0;
   box-shadow:0 10px 40px rgba(0,0,0,.75);pointer-events:none}
  #num{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--faint)}
  #title{font-size:clamp(17px,2.6vw,26px);font-weight:900;margin:4px 0 0;letter-spacing:-.01em}
  #sub{font-size:13.5px;color:var(--dim);margin:3px 0 0;max-width:62ch}

  #mini{position:fixed;top:16px;right:16px;width:168px;border:1px solid var(--line);
   border-radius:9px;background:rgba(13,18,25,.88);overflow:hidden}
  #mini svg{height:auto}
  #cam{fill:rgba(126,224,208,.16);stroke:#7ee0d0;stroke-width:5;vector-effect:non-scaling-stroke;
   transition:all .6s ease}

  #dots{position:fixed;top:20px;left:20px;display:flex;gap:6px}
  #dots i{width:7px;height:7px;border-radius:50%;background:#2a3444;display:block;transition:.3s}
  #dots i.on{background:#7ee0d0;transform:scale(1.35)}
  #dots i.past{background:#44566e}

  #nav{position:fixed;right:16px;bottom:16px;display:flex;gap:8px;z-index:5}
  #nav button{background:var(--ink2);border:1px solid var(--line);color:var(--dim);
   border-radius:9px;width:44px;height:40px;font:inherit;font-size:17px;cursor:pointer}
  #nav button:hover{color:var(--text);border-color:#3a4759}
  #hint{position:fixed;left:20px;bottom:18px;font-family:var(--mono);font-size:10.5px;
   color:#3c4658;pointer-events:none}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap">
</head>
<body>
<div id="view">
<svg id="map" viewBox="0 0 1600 900" role="img"
     aria-label="机の上の全体図。スタックチャン、MacBook、DJ機材、iPad、背景スクリーン、LEDテープの配置と、その間を流れるデータ">
 <defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5"
          orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>
  <radialGradient id="gl"><stop offset="0" stop-color="#fff" stop-opacity=".30"/>
   <stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
 </defs>

 <!-- 会場（奥） -->
 <rect x="0" y="0" width="1600" height="900" fill="#06080c"/>
 <g id="p-stage" class="part">
   <rect x="250" y="60" width="1100" height="300" rx="10" fill="#0c1119" stroke="#2a3444"/>
   <rect x="268" y="78" width="1064" height="264" rx="6" fill="#0a0f16"/>
   <text x="800" y="120" font-size="19" font-weight="700" fill="#ff8fb1" text-anchor="middle">背景スクリーン</text>
   <text x="800" y="150" font-size="14" fill="#8d9bb2" text-anchor="middle">ブラウザ1枚。奥から手前へ7層</text>
   <text x="800" y="182" font-size="13" fill="#5b687e" text-anchor="middle">流れているのは、このロボット自身のソースコード</text>
   <g font-family="JetBrains Mono, monospace" font-size="11" fill="#2f3d4f">
     <text x="300" y="230">async def reconcile(self):</text>
     <text x="300" y="252">    await self.head.apply(pose)</text>
     <text x="300" y="274">    self.led.push(colors)</text>
     <text x="1010" y="230">def burst_amount(v):</text>
     <text x="1010" y="252">    return clamp((v-0.70)/0.26)</text>
     <text x="1010" y="274">    # 70%で赤、100%で花火</text>
   </g>
   <circle class="glow" cx="800" cy="210" r="420" fill="url(#gl)"/>
 </g>

 <!-- 柱のLED -->
 <g id="p-tape" class="part">
   <rect x="238" y="60" width="9" height="300" rx="4" fill="#123026" stroke="#3ee39b" stroke-opacity=".5"/>
   <rect x="1353" y="60" width="9" height="300" rx="4" fill="#123026" stroke="#3ee39b" stroke-opacity=".5"/>
   <text x="196" y="215" font-size="12" fill="#3ee39b" text-anchor="middle">柱の</text>
   <text x="196" y="232" font-size="12" fill="#3ee39b" text-anchor="middle">LED</text>
 </g>

 <!-- 机 -->
 <rect x="120" y="430" width="1360" height="410" rx="16" fill="#0b1017" stroke="#232c39"/>
 <text x="150" y="826" font-size="12" font-family="JetBrains Mono, monospace" fill="#3c4658">THE DESK</text>

 <!-- MacBook -->
 <g id="p-mac" class="part">
   <rect x="170" y="500" width="250" height="180" rx="10" fill="#0f1620" stroke="#79b8ff" stroke-opacity=".55"/>
   <rect x="186" y="516" width="218" height="118" rx="5" fill="#0a1018"/>
   <text x="295" y="560" font-size="17" font-weight="700" fill="#79b8ff" text-anchor="middle">MacBook</text>
   <text x="295" y="586" font-size="12.5" fill="#8d9bb2" text-anchor="middle">gateway / 頭脳 / 声</text>
   <text x="295" y="608" font-size="12.5" fill="#8d9bb2" text-anchor="middle">Ollama・VOICEVOX</text>
   <text x="295" y="664" font-size="11.5" font-family="JetBrains Mono, monospace" fill="#5b687e" text-anchor="middle">★ここに全部載る</text>
   <circle class="glow" cx="295" cy="590" r="210" fill="url(#gl)"/>
 </g>

 <!-- スタックチャン -->
 <g id="p-bot" class="part">
   <rect x="700" y="470" width="200" height="180" rx="14" fill="#101823" stroke="#3ee39b" stroke-opacity=".6"/>
   <rect x="726" y="496" width="148" height="104" rx="8" fill="#08121a"/>
   <circle cx="768" cy="540" r="13" fill="#3ee39b"/><circle cx="832" cy="540" r="13" fill="#3ee39b"/>
   <path d="M772,570 Q800,586 828,570" stroke="#3ee39b" stroke-width="3" fill="none"/>
   <text x="800" y="624" font-size="14" font-weight="700" fill="#3ee39b" text-anchor="middle">スタックチャン</text>
   <text x="800" y="644" font-size="11.5" fill="#8d9bb2" text-anchor="middle">入口と出口だけ・首30回/秒</text>
   <!-- 実機まわりのLED -->
   <g id="p-led" class="part">
     <rect x="674" y="466" width="252" height="192" rx="18" fill="none"
           stroke="#3ee39b" stroke-opacity=".35" stroke-dasharray="4 7"/>
     <text x="800" y="452" font-size="11.5" fill="#3ee39b" text-anchor="middle">物理LED 30粒</text>
   </g>
   <circle class="glow" cx="800" cy="560" r="230" fill="url(#gl)"/>
 </g>

 <!-- DJ機材 -->
 <g id="p-dj" class="part">
   <rect x="620" y="700" width="380" height="120" rx="10" fill="#141019" stroke="#ffb347" stroke-opacity=".6"/>
   <circle cx="668" cy="744" r="19" fill="#1d1a22" stroke="#ffb347" stroke-opacity=".7"/>
   <circle cx="952" cy="744" r="19" fill="#1d1a22" stroke="#ffb347" stroke-opacity=".7"/>
   <g fill="#1d1a22" stroke="#ffb347" stroke-opacity=".45">
     <rect x="706" y="722" width="26" height="26" rx="4"/><rect x="742" y="722" width="26" height="26" rx="4"/>
     <rect x="778" y="722" width="26" height="26" rx="4"/><rect x="814" y="722" width="26" height="26" rx="4"/>
   </g>
   <rect x="878" y="716" width="10" height="64" rx="5" fill="#1d1a22" stroke="#ffb347" stroke-opacity=".6"/>
   <text x="810" y="792" font-size="13" font-weight="700" fill="#ffb347" text-anchor="middle">DJ機材（DDJ-FLX2）</text>
   <text x="1020" y="740" font-size="12" fill="#8d9bb2">つまみ→首</text>
   <text x="1020" y="760" font-size="12" fill="#8d9bb2">パッド→表情・LED</text>
   <text x="1020" y="780" font-size="12" fill="#8d9bb2">フェーダー→バースト</text>
   <circle class="glow" cx="810" cy="760" r="250" fill="url(#gl)"/>
 </g>

 <!-- iPad -->
 <g id="p-ipad" class="part">
   <rect x="1180" y="500" width="230" height="170" rx="12" fill="#0f1620" stroke="#8d9bb2" stroke-opacity=".5"/>
   <rect x="1196" y="516" width="198" height="138" rx="6" fill="#0a1018"/>
   <text x="1295" y="570" font-size="16" font-weight="700" fill="#e6ecf7" text-anchor="middle">iPad</text>
   <text x="1295" y="596" font-size="12.5" fill="#8d9bb2" text-anchor="middle">ブラウザだけ</text>
   <text x="1295" y="618" font-size="12" fill="#5b687e" text-anchor="middle">背景を映す</text>
   <circle class="glow" cx="1295" cy="585" r="200" fill="url(#gl)"/>
 </g>

 <!-- 参加者のスマホ -->
 <g id="p-phone" class="part">
   <rect x="1210" y="700" width="80" height="120" rx="10" fill="#0f1620" stroke="#c874ff" stroke-opacity=".5"/>
   <text x="1250" y="766" font-size="11" fill="#c874ff" text-anchor="middle">質疑</text>
   <text x="1250" y="782" font-size="11" fill="#c874ff" text-anchor="middle">/qa</text>
   <text x="1350" y="756" font-size="12" fill="#8d9bb2">参加者のスマホ</text>
   <circle class="glow" cx="1250" cy="760" r="170" fill="url(#gl)"/>
 </g>

 <!-- 線 -->
 <g fill="none" stroke-width="2">
   <g id="f-mac-bot" class="part" color="#3ee39b">
     <path d="M420,565 L700,555" stroke="#2a3a45" marker-end="url(#a)"/>
     <path class="flow" d="M420,565 L700,555" stroke="#3ee39b"/>
     <text x="560" y="540" font-size="11.5" fill="#5b687e" text-anchor="middle">角度と色</text>
   </g>
   <g id="f-bot-mac" class="part" color="#79b8ff">
     <path d="M700,600 L420,620" stroke="#2a3a45" marker-end="url(#a)"/>
     <path class="flow" d="M700,600 L420,620" stroke="#79b8ff"/>
     <text x="560" y="648" font-size="11.5" fill="#5b687e" text-anchor="middle">声・映像・タッチ</text>
   </g>
   <g id="f-dj-mac" class="part" color="#ffb347">
     <path d="M620,760 L330,690" stroke="#3a3020" marker-end="url(#a)"/>
     <path class="flow" d="M620,760 L330,690" stroke="#ffb347"/>
     <text x="452" y="748" font-size="11.5" fill="#5b687e" text-anchor="middle">番号と 0〜127</text>
   </g>
   <g id="f-mac-stage" class="part" color="#ff8fb1">
     <path d="M330,500 L330,370 L1240,370 L1240,500" stroke="#3a2a33" marker-end="url(#a)"/>
     <path class="flow" d="M330,500 L330,370 L1240,370 L1240,500" stroke="#ff8fb1"/>
     <text x="790" y="358" font-size="11.5" fill="#5b687e" text-anchor="middle">同じ30個の配列（実機と画面へ）</text>
   </g>
   <g id="f-phone-mac" class="part" color="#c874ff">
     <path d="M1210,780 L420,700" stroke="#2e2338" marker-end="url(#a)"/>
     <path class="flow" d="M1210,780 L420,700" stroke="#c874ff"/>
   </g>
 </g>

</svg>
</div>

<div id="mini"></div>
<div id="dots"></div>
<div id="head"><div id="num"></div><h1 id="title"></h1><p id="sub"></p></div>
<div id="nav"><button id="prev" title="前へ">‹</button><button id="next" title="次へ">›</button></div>
<div id="hint">← → 次へ ／ 0 で全景へ戻る</div>

<script>
(function(){
  // ★絵とカメラを分ける。シーンは「どこを見るか」と「何を光らせるか」だけ持つ
  var S=[
   {id:"all", t:"この机の上の、全部", s:"実機・Mac・DJ機材・iPad・背景。ここから出ていくものは無い。",
    v:[0,0,1600,900], hot:[]},
   {id:"bot", t:"実機は、入口と出口だけ", s:"中にAIは入っていない。受け取るのは角度と色の列。1秒に首30回・色20回。",
    v:[600,410,420,340], hot:["p-bot","p-led"]},
   {id:"cut", t:"線を切ると、止まる", s:"「これだけで全部止まります。中身は、この子の中に無いからです」",
    v:[180,440,900,320], hot:["p-bot","p-mac","f-mac-bot","f-bot-mac"]},
   {id:"all2", t:"全景に戻る", s:"いま見ていたのは、ここでした。", v:[0,0,1600,900], hot:[]},
   {id:"mac", t:"頭脳は、この机の上のMacに", s:"gateway・Ollama・VOICEVOX。当日はこれ1台に全部載っている。",
    v:[140,470,480,260], hot:["p-mac"]},
   {id:"fw", t:"ファームの中に、道具が49個", s:"MCP。取扱説明書と製品が、同じものになった。",
    v:[600,410,420,340], hot:["p-bot"]},
   {id:"all3", t:"全景に戻る", s:"", v:[0,0,1600,900], hot:[]},
   {id:"dj", t:"DJ機材は、USBで刺さっているだけ", s:"流れているのは番号と、0〜127の値。それだけ。",
    v:[580,660,560,220], hot:["p-dj","f-dj-mac"]},
   {id:"dj2", t:"手つきが、そのまま演出になる", s:"特別な操作画面は1つも無い。つまみ→首、擦る→光、フェーダー→会場。",
    v:[180,640,1000,260], hot:["p-dj","p-mac","f-dj-mac"]},
   {id:"led", t:"実機と画面が、同じ配列を見ている", s:"作り直していない。同じ30個を2つに送っているだけ。",
    v:[200,40,1250,680], hot:["p-tape","p-led","p-stage","f-mac-stage"]},
   {id:"qa", t:"参加者のスマホも、ここに繋がる", s:"質問も、この机の上で答えている。外には出ない。",
    v:[1100,660,420,200], hot:["p-phone","f-phone-mac"]},
   {id:"end", t:"出会う場所は、この机の上でした", s:"",
    v:[0,0,1600,900], hot:[], flow:true}
  ];

  var svg=document.getElementById('map'), head=document.getElementById('head'),
      numEl=document.getElementById('num'), titleEl=document.getElementById('title'),
      subEl=document.getElementById('sub'), dots=document.getElementById('dots'),
      mini=document.getElementById('mini');
  var i=0, anim=null;
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

  S.forEach(function(){var d=document.createElement('i');dots.appendChild(d);});
  mini.innerHTML='<svg viewBox="0 0 1600 900">'+
    '<rect x="0" y="0" width="1600" height="900" fill="#0a0f16"/>'+
    '<rect x="250" y="60" width="1100" height="300" fill="#1a2430"/>'+
    '<rect x="120" y="430" width="1360" height="410" fill="#141c26"/>'+
    '<rect x="170" y="500" width="250" height="180" fill="#2a3f5a"/>'+
    '<rect x="700" y="470" width="200" height="180" fill="#245040"/>'+
    '<rect x="620" y="700" width="380" height="120" fill="#4a3a1e"/>'+
    '<rect x="1180" y="500" width="230" height="170" fill="#2b3444"/>'+
    '<rect id="cam" x="0" y="0" width="1600" height="900"/></svg>';
  var cam=document.getElementById('cam');

  function ease(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;}

  // ★画面の縦横比に合わせて、見る枠を広げる。
  //   合わせないと、寄ったとき**片側にだけ余白**が出る（実測）。
  function fit(v){
    var r=svg.getBoundingClientRect(), want=r.width/r.height||16/9;
    var x=v[0],y=v[1],w=v[2],h=v[3], cx=x+w/2, cy=y+h/2;
    if(w/h < want){ w = h*want; } else { h = w/want; }
    var pad=1.06; w*=pad; h*=pad;                 // ★端に物が触れないよう、少しだけ引く
    return [cx-w/2, cy-h/2, w, h];
  }

  function go(n,instant){
    i=Math.max(0,Math.min(S.length-1,n));
    var sc=S[i];
    numEl.textContent=String(i+1).padStart(2,'0')+' / '+String(S.length).padStart(2,'0');
    titleEl.textContent=sc.t; subEl.textContent=sc.s||'';
    [].forEach.call(dots.children,function(d,k){
      d.className = k===i?'on':(k<i?'past':'');});

    svg.querySelectorAll('.hot').forEach(function(e){e.classList.remove('hot');});
    svg.classList.toggle('dim', sc.hot.length>0);
    svg.classList.toggle('showflow', !!sc.flow);
    sc.hot.forEach(function(id){
      var e=document.getElementById(id); if(e)e.classList.add('hot');});

    var from=svg.getAttribute('viewBox').split(' ').map(Number), to=fit(sc.v);
    cam.setAttribute('x',to[0]);cam.setAttribute('y',to[1]);
    cam.setAttribute('width',to[2]);cam.setAttribute('height',to[3]);
    if(history.replaceState)history.replaceState(null,'','#'+sc.id);
    if(instant||reduce){svg.setAttribute('viewBox',to.join(' '));return;}
    if(anim)cancelAnimationFrame(anim);
    var t0=performance.now(), dur=760;
    (function step(now){
      var p=ease(Math.min(1,(now-t0)/dur));
      svg.setAttribute('viewBox',from.map(function(v,k){return v+(to[k]-v)*p;}).join(' '));
      if(p<1)anim=requestAnimationFrame(step);
    })(t0);
  }

  document.getElementById('next').onclick=function(){go(i+1);};
  document.getElementById('prev').onclick=function(){go(i-1);};
  addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();go(i+1);}
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(i-1);}
    else if(e.key==='0'){go(0);}                 // ★迷ったら全景。これだけ覚える
  });
  addEventListener('resize', function(){ go(i, true); });   // ★向きを変えても崩れない
  var start=S.findIndex(function(s){return '#'+s.id===location.hash;});
  go(start<0?0:start,true);                       // ★どの場面からでも入れる
})();
</script>
</body>
</html>
